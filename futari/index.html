<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ウリログ">
<meta name="theme-color" content="#fdf8f4">
<title>ウリログ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="icon" type="image/png" href="icon-192.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navb:max(4px, calc(env(safe-area-inset-bottom) - 16px));
  --bg:#fdf8f4; --card:#fff;
  --pink:#f4a3b8; --pink-d:#e2809c; --pink-l:#fde8ee;
  --lav:#b8a6e6; --lav-d:#9580d0; --lav-l:#f0ebfb;
  --peach:#ffbfa8; --peach-l:#fff0ea;
  --mint:#a6d9c4; --mint-d:#6fbb9c; --mint-l:#e7f6ef;
  --butter:#ffe6a6; --butter-l:#fff8e3;
  --text:#5d4e60; --muted:#a898aa; --line:#f1e6ea;
  --r:22px; --shadow:0 6px 22px rgba(176,128,160,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:15px;line-height:1.6}
body{background-image:radial-gradient(circle at 12% 8%,#fde8ee 0,transparent 32%),radial-gradient(circle at 92% 22%,#f0ebfb 0,transparent 30%),radial-gradient(circle at 20% 90%,#e7f6ef 0,transparent 30%);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lav-d)}
.wrap{overflow-x:clip;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(var(--navb) + 94px)}
.hide{display:none!important}

/* ヘッダー */
header.top{display:flex;align-items:center;gap:10px;padding:10px 2px 12px}
.logo{font-weight:700;font-size:22px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.logo .h{color:var(--pink-d)}
.logo .b{color:var(--lav-d)}
.logo svg{width:22px;height:22px}
.status{font-size:11px;padding:3px 10px;border-radius:99px;background:var(--mint-l);color:var(--mint-d);font-weight:500;white-space:nowrap}
.status.wait{background:var(--butter-l);color:#c79a2c}
.iconbtn{margin-left:auto;border:0;background:var(--card);width:40px;height:40px;border-radius:50%;box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--lav-d)}

/* カード・ボタン */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--pink-d);display:flex;align-items:center;gap:6px}
.muted{color:var(--muted);font-size:13px}
.btn{border:0;background:linear-gradient(135deg,#f4a3b8,#e2809c);color:#fff;border-radius:99px;padding:12px 20px;font-weight:700;cursor:pointer;box-shadow:0 5px 14px rgba(226,128,156,.32);letter-spacing:.03em}
.btn:disabled{opacity:.55}
.btn.lav{background:linear-gradient(135deg,#c7b8ef,#9580d0);box-shadow:0 5px 14px rgba(149,128,208,.3)}
.btn.mint{background:linear-gradient(135deg,#bfe5d4,#6fbb9c);box-shadow:0 5px 14px rgba(111,187,156,.3)}
.btn.sub{background:var(--pink-l);color:var(--pink-d);box-shadow:none}
.btn.ghost{background:#fff;color:var(--text);box-shadow:none;border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:#d46a7e;box-shadow:none;border:1.5px solid #f6d3da}
.btn.block{width:100%}
.btn.sm{padding:7px 14px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.gap{height:10px}

/* 入力 */
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 4px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:11px 14px;outline:none;font-size:16px}
.in:focus{border-color:var(--pink)}
textarea.in{min-height:76px;resize:vertical}
.err{color:#d46a7e;font-size:13px;margin:4px 4px 10px;min-height:1em}

/* ログイン */
.hero{text-align:center;padding:42px 8px 18px}
.hero .mark{width:86px;height:86px;margin:0 auto 10px;border-radius:30px;background:linear-gradient(135deg,#fde8ee,#f0ebfb);display:grid;place-items:center;box-shadow:var(--shadow)}
.hero .mark svg{width:46px;height:46px}
.hero h1{font-size:28px;margin:6px 0 2px;letter-spacing:.06em}
.hero p{margin:0;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--pink-l);border-radius:99px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;border-radius:99px;padding:8px;cursor:pointer;color:var(--pink-d);font-weight:500}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(226,128,156,.18);font-weight:700}
.linkbtn{border:0;background:none;color:var(--lav-d);font-size:13px;cursor:pointer;padding:6px;text-decoration:underline}

/* 招待バナー */
.invite{background:linear-gradient(135deg,#fff0ea,#fde8ee 55%,#f0ebfb);position:relative;overflow:hidden}
.invite p{margin:2px 0 12px;font-size:13px}
.invite .deco{position:absolute;right:-8px;top:-10px;font-size:62px;opacity:.25;transform:rotate(12deg)}

/* 絞り込み */
.search{position:relative;margin-bottom:10px}
.search input{padding-left:38px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--lav-l);border-color:var(--lav);color:var(--lav-d);font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px}
.bar .count{font-size:12px;color:var(--muted)}
.bar select{border:0;background:transparent;color:var(--lav-d);font-size:13px;cursor:pointer}

/* 候補カード */
.place{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:12px 12px 12px 12px;margin-bottom:10px;cursor:pointer;position:relative}
.place.both{box-shadow:0 0 0 2px #f7c6d3,var(--shadow)}
.cat{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none}
.place .main{flex:1;min-width:0}
.place .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place .who{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:99px;padding:1px 8px;background:var(--pink-l);color:var(--pink-d)}
.tag.lav{background:var(--lav-l);color:var(--lav-d)}
.tag.gray{background:#f5f0f3;color:var(--muted)}
.heart{border:0;background:var(--pink-l);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}
.heart svg{width:22px;height:22px;fill:none;stroke:var(--pink-d);stroke-width:2}
.heart.on{background:linear-gradient(135deg,#f9b6c7,#e2809c)}
.heart.on svg{fill:#fff;stroke:#fff}
.heart:active{transform:scale(.88)}
.ribbon{position:absolute;top:-7px;left:14px;font-size:11px;background:linear-gradient(135deg,#f9b6c7,#e2809c);color:#fff;border-radius:99px;padding:1px 9px;font-weight:700}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:46px;margin-bottom:6px}
.empty p{margin:4px 0}

/* 思い出 */
.memo{background:#fff;border-radius:6px 6px 20px 20px;box-shadow:var(--shadow);padding:10px 10px 14px;margin-bottom:14px;cursor:pointer}
.memo .ph{height:84px;border-radius:4px;display:grid;place-items:center;font-size:40px}
.memo .t{font-weight:700;margin:8px 4px 0}
.memo .d{font-size:12px;color:var(--muted);margin:0 4px}
.memo .n{font-size:13px;margin:6px 4px 0;white-space:pre-wrap}
.memos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.memos .memo{margin:0}
.memos .memo:nth-child(odd){transform:rotate(-1.2deg)}
.memos .memo:nth-child(even){transform:rotate(1.2deg)}

@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

/* 下のメニュー */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px var(--navb)}
nav.tabs .in2{max-width:520px;margin:0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:26px;box-shadow:0 8px 28px rgba(176,128,160,.2);display:flex;padding:6px}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:20px;padding:6px 2px 4px;cursor:pointer;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--pink-d);background:var(--pink-l);font-weight:700}
nav.tabs .n{font-size:10px;background:var(--pink-d);color:#fff;border-radius:99px;padding:0 5px;margin-left:2px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(var(--navb) + 78px);z-index:21;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#c7b8ef,#9580d0);box-shadow:0 8px 20px rgba(149,128,208,.4);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4}

/* シート（下から出る画面） */
.ov{position:fixed;inset:0;background:rgba(93,78,96,.32);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .22s ease}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#e8dbe2;margin:2px auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;border:0;background:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:18px;box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.catpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.catpick button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:8px 2px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.catpick button b{font-size:22px;font-weight:400}
.catpick button.on{border-color:var(--pink);background:var(--pink-l);color:var(--pink-d);font-weight:700}
.detail .head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.detail .head .cat{width:58px;height:58px;font-size:30px;border-radius:20px}
.detail .ttl{font-size:19px;font-weight:700;line-height:1.35}
.kv{background:#fff;border-radius:18px;padding:4px 14px;margin-bottom:12px}
.kv div{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
.kv div:first-child{border-top:0}
.kv b{flex:none;width:74px;color:var(--muted);font-weight:500;font-size:13px}
.kv span{flex:1;min-width:0;white-space:pre-wrap;word-break:break-all}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.vote{background:#fff;border-radius:18px;padding:10px;text-align:center;font-size:13px}
.vote .ic{font-size:22px}
.vote.on{background:var(--pink-l);color:var(--pink-d);font-weight:700}
.linkbox{display:flex;gap:6px;align-items:center;background:#fff;border:1.5px dashed var(--lav);border-radius:16px;padding:10px 12px;font-size:12px;word-break:break-all;margin:6px 0 10px}

/* 記念日カウンター */
.anniv{background:linear-gradient(135deg,#fff0ea,#fde8ee 60%,#f0ebfb);display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;overflow:hidden}
.anniv .num{font-size:34px;font-weight:700;color:var(--pink-d);line-height:1.1}
.anniv .num small{font-size:14px;margin-left:2px}
.anniv .lbl{font-size:12px;color:var(--muted)}
.anniv .next{margin-left:auto;text-align:right;font-size:12px;color:var(--text)}
.anniv .next b{display:block;font-size:15px;color:var(--lav-d)}
.anniv .party{position:absolute;left:46%;bottom:-14px;font-size:44px;opacity:.18}
.anniv.today{box-shadow:0 0 0 2px #f7c6d3,var(--shadow)}
.anniv-empty{display:flex;align-items:center;gap:10px;font-size:13px}
.anniv-empty .btn{margin-left:auto;flex:none}

/* スワイプ */
.deck{position:relative;height:min(58vh,440px);margin:6px 0 16px}
.scard{position:absolute;inset:0;background:#fff;border-radius:28px;box-shadow:0 10px 30px rgba(176,128,160,.22);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .25s ease,opacity .25s;display:flex;flex-direction:column}
.scard.back{transform:scale(.94) translateY(14px);opacity:.7;pointer-events:none}
.scard .art{flex:1;display:grid;place-items:center;font-size:96px;min-height:0}
.scard .info{padding:16px 20px 20px}
.scard .t{font-size:21px;font-weight:700;line-height:1.35}
.scard .s{font-size:13px;color:var(--muted);margin-top:2px}
.scard .m{font-size:13px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.stamp{position:absolute;top:22px;padding:4px 14px;border-radius:14px;font-weight:700;font-size:22px;opacity:0;border:3px solid;background:rgba(255,255,255,.85);transform:rotate(-12deg)}
.stamp.like{left:20px;color:var(--pink-d);border-color:var(--pink-d)}
.stamp.pass{right:20px;color:#a898aa;border-color:#c9bccb;transform:rotate(12deg)}
.sbtns{display:flex;justify-content:center;gap:28px;align-items:center}
.sbtn{width:66px;height:66px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:28px;cursor:pointer;display:grid;place-items:center}
.sbtn.like{background:linear-gradient(135deg,#f9b6c7,#e2809c);color:#fff;width:76px;height:76px;font-size:32px}
.sbtn:active{transform:scale(.9)}
.sprog{text-align:center;font-size:12px;color:var(--muted)}

/* マッチ！ */
.fx{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(253,232,238,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s;padding:24px}
.fx .box{text-align:center;max-width:360px;width:100%}
.fx h2{font-size:40px;margin:0;color:var(--pink-d);letter-spacing:.06em;animation:pop .6s ease}
.fx .hearts{font-size:64px;animation:beat 1s ease infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.fx .pl{background:#fff;border-radius:20px;padding:12px 14px;margin:14px 0;box-shadow:var(--shadow);font-weight:700}
.fx .pl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.fly{position:fixed;bottom:-40px;font-size:26px;z-index:71;pointer-events:none;animation:flyup 2.6s ease-in forwards}
@keyframes flyup{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.zoom{position:fixed;inset:0;z-index:72;background:rgba(40,30,45,.88);display:grid;place-items:center;animation:fade .2s}
.zoom img{max-width:94vw;max-height:88vh;border-radius:14px}

/* 写真 */
.memo .ph.img{background-size:cover!important;background-position:center!important;font-size:0;height:120px}
.dphoto{width:100%;border-radius:20px;display:block;margin-bottom:12px;cursor:zoom-in;background:#f5f0f3;min-height:120px;object-fit:cover;max-height:340px}
.photopick{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.photopick .pv{width:84px;height:84px;border-radius:16px;background:#fff center/cover no-repeat;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:28px;flex:none}
.photopick label.btn{display:inline-block}

.toast{position:fixed;left:50%;bottom:calc(var(--navb) + 90px);transform:translateX(-50%);background:rgba(93,78,96,.92);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;animation:fade .2s;max-width:90vw;text-align:center}
.center{text-align:center;padding:80px 20px;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--pink-l);border-top-color:var(--pink-d);animation:rot 1s linear infinite;margin:0 auto 12px}
@keyframes rot{to{transform:rotate(360deg)}}
.sec{font-size:12px;color:var(--muted);margin:16px 6px 6px}
.menu{background:#fff;border-radius:20px;overflow:hidden;margin-bottom:12px}
.menu button,.menu .itm{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:13px 16px;cursor:pointer;text-align:left;border-top:1px solid var(--line);font-size:14px}
.menu>*:first-child{border-top:0}
.menu .r{margin-left:auto;color:var(--muted);font-size:13px}

/* カウントダウン（記念日カウンターとそろえた見た目） */
.anniv.cd{background:linear-gradient(135deg,#f0ebfb,#fde8ee 60%,#fff0ea)}
.anniv.cd .num{color:var(--lav-d)}
.anniv.cd .num small:first-child{margin:0 2px 0 0}
.anniv.cd .next{min-width:0;max-width:58%}
.anniv.cd .next b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--pink-d)}

/* カレンダー */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head b{font-size:17px;flex:1;text-align:center}
.cal-nav{border:0;background:var(--pink-l);width:36px;height:36px;border-radius:50%;color:var(--pink-d);font-size:18px;cursor:pointer;flex:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-w{font-size:11px;color:var(--muted);padding:2px 0 4px}
.cal-w.sun,.cal-d.sun .n{color:#e2809c}
.cal-w.sat,.cal-d.sat .n{color:var(--lav-d)}
.cal-d{border:0;background:none;height:46px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-size:14px}
.cal-d .n{width:28px;height:28px;line-height:28px;border-radius:50%}
.cal-d.out{opacity:.32}
.cal-d.today .n{background:var(--lav-l);font-weight:700}
.cal-d.sel{background:linear-gradient(135deg,#f9b6c7,#e2809c)}
.cal-d.sel .n{color:#fff!important;background:none;font-weight:700}
.cal-d .dots{display:flex;gap:2px;height:6px}
.cal-d .dots i{width:6px;height:6px;border-radius:50%;background:var(--pink-d)}
.cal-d.sel .dots i{background:#fff}
.ditem{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:10px;cursor:pointer}
.ditem.past{opacity:.6}
.ditem .dd{width:50px;flex:none;text-align:center;border-radius:16px;background:var(--pink-l);color:var(--pink-d);padding:4px 0;line-height:1.2}
.ditem .dd b{display:block;font-size:20px}
.ditem .dd small{font-size:10px}
.ditem .main{flex:1;min-width:0}
.ditem .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ditem .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ditem .tag{flex:none}

/* 相性テスト */
.qset{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px;cursor:pointer}
.qset .main{flex:1;min-width:0}
.qset .t{font-weight:700}
.qset .r{color:var(--muted);font-size:20px}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qtop .muted{margin-left:auto}

    const r = Math.min(1, side / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * r); c.height = Math.round(im.naturalHeight * r);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    out = c.toDataURL("image/jpeg", q);
    if (out.length <= maxBytes) return out;
    if (q > 0.55) q -= 0.1; else side = Math.round(side * 0.8);
  }
  return out;
}

async function joinRoom(){
  const inv = S.invite; if (!inv || S.busy) return; S.busy = true;
  const err = document.getElementById("jerr");
  try {
    await updateDoc(doc(db, "rooms", inv.roomId), { members: arrayUnion(me()), ["names." + me()]: S.profile.name });
    const old = S.profile.roomId;
    await setDoc(doc(db, "users", me()), { roomId: inv.roomId }, { merge: true });
    try { await deleteDoc(doc(db, "invites", myEmail())); } catch {}
    if (old && old !== inv.roomId) { try { await leaveRoomDoc(old); } catch {} }
    S.profile.roomId = inv.roomId; S.invite = null;
    toast("参加しました♡");
    openRoom(inv.roomId);
  } catch (e) {
    err.textContent = e.code === "permission-denied"
      ? "参加できませんでした。招待が取り消されたか、ルームがすでにふたりでいっぱいかもしれません。"
      : "参加できませんでした（" + (e.code || e.message) + "）";
  }
  S.busy = false;
}

async function leaveRoomDoc(roomId){
  const ref = doc(db, "rooms", roomId);
  const snap = await getDoc(ref); if (!snap.exists()) return;
  const r = snap.data();
  await updateDoc(ref, { members: (r.members || []).filter(u => u !== me()), ["names." + me()]: deleteField() });
}

/* =============== ルームを開く（リアルタイムで受け取る） =============== */
function openRoom(roomId, fresh){
  stopSubs();
  S.roomId = roomId; S.room = null; S.places = [];
  let gotRoom = false, gotPlaces = false;
  S.subs.push(onSnapshot(doc(db, "rooms", roomId), snap => {
    if (!snap.exists() || !(snap.data().members || []).includes(me())) return lostRoom();
    S.room = snap.data(); gotRoom = true;
    if (gotPlaces) { render(); checkMatches(); }
    if (fresh) { fresh = false; setTimeout(openInvite, 300); }
  }, e => e.code === "permission-denied" ? lostRoom() : renderFatal(e, "ルームの読みこみ")));
  S.subs.push(onSnapshot(collection(db, "rooms", roomId, "places"), snap => {
    S.places = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    gotPlaces = true;
    if (gotRoom) { render(); checkMatches(); }
  }, e => setTimeout(() => { if (S.roomId === roomId) renderFatal(e, "候補の読みこみ"); }, 800)));
  // デートの予定と相性テスト（ルールが未更新でも、ほかの機能は止めない）
  S.dates = []; S.quiz = {}; S.extraErr = null;
  const extraErr = e => { S.extraErr = e.code || e.message; if (gotRoom && gotPlaces) render(); };
  S.subs.push(onSnapshot(collection(db, "rooms", roomId, "dates"), snap => {
    S.dates = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.extraErr = null;
    if (gotRoom && gotPlaces) render();
  }, extraErr));
  cleanupPosts(roomId);
  // 今日の質問・お願いチケット（ルールが未更新でも、ほかの機能は止めない）
  S.qa = {}; S.tickets = []; S.needRules = false;
  const needRules = e => { if (e.code === "permission-denied") { S.needRules = true; if (gotRoom && gotPlaces) render(); } };
  S.subs.push(onSnapshot(collection(db, "rooms", roomId, "qa"), snap => {
    S.qa = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    if (gotRoom && gotPlaces && !document.activeElement?.closest?.(".qaform")) render();
    if (document.getElementById("qhist")) document.getElementById("qhist").innerHTML = qaHistHtml();
  }, needRules));
  S.pet = null;
  S.subs.push(onSnapshot(doc(db, "rooms", roomId, "meta", "pet"), snap => {
    S.pet = snap.exists() ? snap.data() : {};
    uriBirth(roomId);
    if (gotRoom && gotPlaces && !uriBusy && !document.activeElement?.closest?.(".qaform")) render();
  }, needRules));
  S.subs.push(onSnapshot(collection(db, "rooms", roomId, "tickets"), snap => {
    S.tickets = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.at || 0) - (a.at || 0));
    if (gotRoom && gotPlaces && !document.activeElement?.closest?.(".qaform")) render();
    if (document.getElementById("tklist")) document.getElementById("tklist").innerHTML = ticketListHtml();
  }, needRules));
  S.subs.push(onSnapshot(collection(db, "rooms", roomId, "quiz"), snap => {
    S.quiz = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    if (gotRoom && gotPlaces) render();
    if (document.getElementById("qbody") && S.qv && S.qv.v !== "play") renderQuiz();
  }, extraErr));
}

function sortPlaces(arr){
  const a = arr.slice();
  if (S.sort === "love") a.sort((x, y) => votesOf(y).length - votesOf(x).length || ms(y.createdAt) - ms(x.createdAt));
  else if (S.sort === "old") a.sort((x, y) => ms(x.createdAt) - ms(y.createdAt));
  else a.sort((x, y) => ms(y.createdAt) - ms(x.createdAt));
  return a;
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  if (S.who === "both" && !isPaired()) S.who = "all";
  return sortPlaces(S.places.filter(p => !p.visited
    && whoOk(p)
    && (S.cat === "all" || p.cat === S.cat)
    && (!q || [p.title, p.area, p.memo].join(" ").toLowerCase().includes(q))));
}

function listHtml(arr){
  if (!arr.length) {
    if (!S.places.filter(p => !p.visited).length) return `<div class="empty"><div class="big">🗺️</div><p>まだ候補がありません</p><p>右下の＋ボタンから、行ってみたい場所を追加してね</p></div>`;

    return `<div class="empty"><div class="big">🔍</div><p>見つかりませんでした</p></div>`;

function annivHtml(){
  const since = S.room?.since;
  if (!since) return `<div class="card anniv-empty"><span style="font-size:22px">💞</span><span class="muted">付き合った日を登録すると、記念日カウンターが出ます</span><button class="btn sub sm" data-a="since">登録</button></div>`;
  const t = today(), days = dayDiff(since, t) + 1;
  if (days < 1) return `<div class="card anniv" data-a="since"><div><div class="lbl">付き合う日まで</div><div class="num">${1 - days}<small>日</small></div></div></div>`;
  // 次の100日ごとの記念日
  const k = Math.ceil(days / 100) * 100, kDate = addDays(since, k - 1), kLeft = k - days;
  // 次の◯周年
  const [sy, sm, sd] = since.split("-").map(Number), ty = +t.slice(0, 4);
  let y = ty, aDate = `${y}-${String(sm).padStart(2,"0")}-${String(sd).padStart(2,"0")}`;
  if (dayDiff(t, aDate) < 0) { y++; aDate = `${y}-${String(sm).padStart(2,"0")}-${String(sd).padStart(2,"0")}`; }
  const years = y - sy, aLeft = dayDiff(t, aDate);
  const items = [{ n: `${k}日目`, left: kLeft, date: kDate }];
  if (years >= 1) items.push({ n: `${years}周年`, left: aLeft, date: aDate });
  items.sort((a, b) => a.left - b.left);
  const nx = items[0], isToday = nx.left === 0;
  return `<div class="card anniv ${isToday ? "today" : ""}" data-a="since">
    ${isToday ? `<span class="party">🎉</span>` : ""}
    <div><div class="lbl">付き合って</div><div class="num">${days.toLocaleString()}<small>日目</small></div></div>
    <div class="next">${isToday ? `<b>🎉 今日は ${nx.n}！</b>おめでとう♡` : `<b>${nx.n}まで あと${nx.left}日</b>${esc(fmtDate(nx.date))}`}</div>
  </div>`;
}

/* =============== スワイプで決める =============== */
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function openSwipe(){
  // 恋人が追加した・まだ見ていない候補を先に、そのあとおすすめ
  S.deck = [...shuffle(unseen().map(p => ({ id: p.id }))), ...shuffle(unseenSamples().map(x => ({ k: x.k })))];
  S.deckPos = 0; S.deckTotal = S.deck.length;
  openSheet(`<h3>🃏 行きたい場所をえらぶ<button class="x" data-a="close">×</button></h3>
    <p class="muted" style="margin:-8px 0 6px;font-size:12px">右にスワイプで「行きたい♡」、左で「パス」。ふたりとも右にした場所はマッチ！</p>
    <div class="chips" style="padding-bottom:4px">${REGIONS.map(([id, n]) => `<button class="chip ${(S.swRegion || "all") === id ? "on" : ""}" data-a="swregion" data-v="${id}">${n}</button>`).join("")}</div>
    <div id="swipebody"></div>`);
  renderDeck();
}
/* デッキの1枚を、表示用の形にそろえる（候補 or おすすめ） */
function deckItem(it){
  if (!it) return null;
  if (it.id) { const p = S.places.find(x => x.id === it.id && !x.visited); return p ? { key: it.id, title: p.title, cat: p.cat, area: p.area, memo: p.memo, by: p.by } : null; }
  const x = SAMPLES.find(s => s.k === it.k);
  if (!x || passedSamples().includes(x.k)) return null;
  const made = S.places.find(p => p.id === sampleId(x.k));
  if (made && ((made.votes || {})[me()] || (made.passes || {})[me()] || made.visited)) return null;
  return { key: "sample:" + x.k, sample: true, title: x.t, cat: x.c, area: x.a, memo: x.m, by: made?.by };
}
function cardHtml(d, back){
  const c = catOf(d.cat);
  return `<div class="scard ${back ? "back" : ""}" ${back ? "" : `id="topcard" data-key="${esc(d.key)}"`}>
    <div class="art" style="background:${c.c}">${c.e}</div>
    ${back ? "" : `<span class="stamp like">行きたい♡</span><span class="stamp pass">パス</span>`}
    <div class="info">${d.sample && !d.by ? `<span class="tag lav" style="margin-bottom:4px;display:inline-block">✨ おすすめ</span>` : ""}<div class="t">${esc(d.title)}</div><div class="s">${esc([d.area, c.n].filter(Boolean).join(" ・ "))}${d.by ? ` ・ ${esc(nameOf(d.by))}が追加` : ""}</div>${d.memo ? `<div class="m">${esc(d.memo)}</div>` : ""}</div>
  </div>`;
}
function renderDeck(){
  const body = document.getElementById("swipebody"); if (!body) return;
  while (S.deckPos < S.deck.length && !deckItem(S.deck[S.deckPos])) S.deckPos++;
  const cur = deckItem(S.deck[S.deckPos]);
  if (!cur) {
    const passed = passedCount();
    body.innerHTML = `<div class="empty"><div class="big">🎉</div><p><b>ぜんぶ見たよ！</b></p><p>${isPaired() ? "ふたりとも右にした場所は「ふたりで♡」に出ます" : "恋人が参加したら、ふたりでスワイプしてみてね"}</p></div>
      ${passed ? `<button class="btn ghost block" data-a="unpass">パスした${passed}件をもう一度見る</button><div class="gap"></div>` : ""}
      <button class="btn block" data-a="close">とじる</button>`;
    return;
  }
  let next = null;
  for (let i = S.deckPos + 1; i < S.deck.length && !next; i++) next = deckItem(S.deck[i]);
  body.innerHTML = `<div class="deck">${next ? cardHtml(next, true) : ""}${cardHtml(cur)}</div>
    <div class="sbtns"><button class="sbtn" data-a="sw" data-v="0" aria-label="パス">✕</button><button class="sbtn like" data-a="sw" data-v="1" aria-label="行きたい">♥</button></div>
    <div class="gap"></div><div class="sprog">${S.deckPos + 1} / ${S.deckTotal}</div>`;
  bindSwipe(document.getElementById("topcard"));
}
function bindSwipe(card){
  let sx = 0, sy = 0, dx = 0, drag = false;
  const like = card.querySelector(".stamp.like"), pass = card.querySelector(".stamp.pass");
  card.addEventListener("pointerdown", e => { drag = true; sx = e.clientX; sy = e.clientY; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = "none"; });
  card.addEventListener("pointermove", e => {
    if (!drag) return; dx = e.clientX - sx;
    card.style.transform = `translate(${dx}px,${(e.clientY - sy) * 0.2}px) rotate(${dx / 16}deg)`;
    like.style.opacity = Math.max(0, Math.min(1, dx / 90)); pass.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (!drag) return; drag = false; card.style.transition = "";
    if (Math.abs(dx) > 90) swipeOut(dx > 0);
    else { card.style.transform = ""; like.style.opacity = 0; pass.style.opacity = 0; }
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}
function swipeOut(isLike){
  const card = document.getElementById("topcard"); if (!card || card.dataset.gone) return;
  card.dataset.gone = "1"; card.removeAttribute("id");
  const key = card.dataset.key;
  card.querySelector(isLike ? ".stamp.like" : ".stamp.pass").style.opacity = 1;
  card.style.transform = `translate(${isLike ? 700 : -700}px,40px) rotate(${isLike ? 30 : -30}deg)`; card.style.opacity = "0";
  saveSwipe(key, isLike).catch(e => toast("保存できませんでした（" + (e.code || e.message) + "）"));
  setTimeout(() => { S.deckPos++; renderDeck(); }, 260);
}
async function saveSwipe(key, isLike){
  if (!key.startsWith("sample:")) {
    return updateDoc(doc(db, "rooms", S.roomId, "places", key), isLike ? { ["votes." + me()]: true, ["passes." + me()]: deleteField() } : { ["passes." + me()]: true });
  }
  const k = key.slice(7), x = SAMPLES.find(s => s.k === k), id = sampleId(k);
  if (!isLike) {
    S.profile.passedSamples = [...new Set([...passedSamples(), k])];
    return setDoc(doc(db, "users", me()), { passedSamples: arrayUnion(k) }, { merge: true });
  }
  // 「行きたい」にしたおすすめは、ふたりの候補に追加する（同じおすすめは同じ候補になる）
  if (S.places.some(p => p.id === id)) return updateDoc(doc(db, "rooms", S.roomId, "places", id), { ["votes." + me()]: true });
  return setDoc(doc(db, "rooms", S.roomId, "places", id), {
    title: x.t, cat: x.c, area: x.a, memo: x.m, url: "", by: me(), sample: true, visited: false,
    votes: { [me()]: true }, createdAt: serverTimestamp(), updatedAt: serverTimestamp()

}
async function unpass(){
  const list = S.places.filter(p => !p.visited && (p.passes || {})[me()]);
  try {
    const b = writeBatch(db);
    list.forEach(p => b.update(doc(db, "rooms", S.roomId, "places", p.id), { ["passes." + me()]: deleteField() }));
    if (passedSamples().length) b.set(doc(db, "users", me()), { passedSamples: [] }, { merge: true });
    await b.commit();
    S.profile.passedSamples = [];
    setTimeout(openSwipe, 200);
  } catch (e) { toast("うまくいきませんでした（" + (e.code || e.message) + "）"); }
}

/* うり坊のイラスト（stage 0〜7、mood: happy / normal / hungry / sad / sleep / eat）
   成長するほど体が大きく横に広がり、しましまが薄れて毛色が濃くなる（本物のイノシシと同じ） */
const UPARTS = [
  // c:毛色 d:足の色 hr:頭[rx,ry] hy:頭の中心 br:体[rx,ry] L:足の長さ e:目の大きさ sn:鼻[rx,ry] so:鼻の位置 ear:耳 sp:しましまの濃さ
  { c:"#e2b68c", d:"#c09068", hr:[33,30], hy:62, br:[22,15], L:5,  e:6.4, sn:[10,7],  so:13, ear:.62, sp:1 },
  { c:"#d9ab80", d:"#b8875f", hr:[32,29], hy:59, br:[26,18], L:8,  e:6,   sn:[11,7.5],so:13, ear:.7,  sp:1 },
  { c:"#d1a176", d:"#ae7e57", hr:[31,28], hy:56, br:[30,21], L:10, e:5.6, sn:[12,8],  so:14, ear:.78, sp:.95 },
  { c:"#c99a72", d:"#a77650", hr:[30,27], hy:53, br:[34,24], L:12, e:5.2, sn:[13,9],  so:15, ear:.86, sp:.85 },
  { c:"#bb8b62", d:"#946644", hr:[29,26], hy:50, br:[38,26], L:13, e:4.8, sn:[14,9.5],so:16, ear:.92, sp:.65 },
  { c:"#a5754f", d:"#7f5638", hr:[28,25], hy:47, br:[42,28], L:14, e:4.4, sn:[15,10], so:17, ear:1,   sp:.4 },
  { c:"#8e6143", d:"#6a452e", hr:[28,25], hy:45, br:[46,30], L:15, e:4.1, sn:[16,10.5],so:18,ear:1.05,sp:.15 },
  { c:"#946646", d:"#6a452e", hr:[28,25], hy:45, br:[46,30], L:15, e:4.1, sn:[16,10.5],so:18,ear:1.05,sp:.12 }
];
function uriSvg(stage, mood){
  const st = Math.max(0, Math.min(UPARTS.length - 1, stage | 0)), P = UPARTS[st];
  const [hx, hy0] = [60, P.hy], [hrx, hry] = P.hr, [brx, bry] = P.br;
  const hy = hy0, ground = 112, by = ground - P.L + 3 - bry;
  const snout = "#f5b5ae", nose = "#c46f68", ink = "#4a3540", light = st >= 5 ? "#e8cfb0" : "#f7e6cf";
  const top = hy - hry, sy = hy + P.so, ey = hy - 1, ex = Math.round(hrx * .42);
  // 目
  let eyes;
  const w = P.e * 1.15;
  if (mood === "happy" || mood === "eat") eyes = `<path d="M${hx-ex-w} ${ey+1}q${w} ${-w*1.2} ${w*2} 0M${hx+ex-w} ${ey+1}q${w} ${-w*1.2} ${w*2} 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  else if (mood === "sleep") eyes = `<path d="M${hx-ex-w} ${ey}q${w} ${w*.9} ${w*2} 0M${hx+ex-w} ${ey}q${w} ${w*.9} ${w*2} 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  else {
    const r = P.e, big = st <= 2;

/* =============== ふたりで育てるうり坊 =============== */
const USTAGES = [[0, "ミニうりぼー"], [20, "よちよちうりぼー"], [50, "ちびうりぼー"], [100, "うりぼー"], [180, "やんちゃうりぼー"], [300, "わかウリ"], [450, "おとなウリ"], [650, "はなかんむりのウリ"]];
const UFOODS = ["🍠", "🌰", "🍎", "🥕", "🍄"];
const dayMs = s => new Date(ymd(s)).getTime();
/* これまでの記録から「ごはん」の記録を作る */
function uriEvents(){
  // 生まれた時（bornAt）より前の記録は数えない。rec は「記録した時刻」
  const born = S.pet?.bornAt || Date.now(), fb = S.pet?.feedBase || {};
  const ev = [], mem = S.room?.members || [], add = (at, who, t, xp, rec) => { if ((rec ?? at ?? 0) >= born) ev.push({ at: at || 0, who, t, xp }); };
  Object.entries(S.qa || {}).forEach(([d, q]) => {
    const a = Object.entries(q.a || {}).filter(([u]) => mem.includes(u));
    a.forEach(([u, x]) => add(x.at || dayMs(d), u, "今日の質問に答えた", 5));
    if (a.length >= 2) add(Math.max(...a.map(([, x]) => x.at || 0)), null, "ふたりとも質問に答えた", 5);
  });
  S.places.forEach(p => {
    if (p.visited) { const at = p.visitedAt ? dayMs(p.visitedAt) : ms(p.updatedAt); add(at, null, `${p.title}に行った`, 20, Math.max(at, p.updatedAt ? ms(p.updatedAt) : 0)); }
    if (isBoth(p)) add(ms(p.updatedAt || p.createdAt), null, `${p.title}でマッチ`, 5);
    Object.entries(p.notes || {}).forEach(([u, n]) => { if (mem.includes(u) && n?.t) add(n.at, u, `${p.title}にひとこと`, 5); });
  });
  S.dates.forEach(d => add(ms(d.createdAt), d.by, "デートの予定を入れた", 5));
  S.tickets.forEach(t => { add(t.at, t.from, `「${t.t}」を贈った`, 3); if (t.status === "done") add(t.doneAt, t.from, `「${t.t}」をかなえた`, 10); });
  Object.entries(S.pet?.feeds || {}).forEach(([u, f]) => { const n = (f?.n || 0) - (fb[u] || 0); if (mem.includes(u) && n > 0) ev.push({ at: f.at || dayMs(f.last), who: u, t: n > 1 ? `ごはんをあげた（これまで${n}回）` : "ごはんをあげた", xp: 3 * n }); });
  return ev.sort((a, b) => b.at - a.at);
}
function uriState(){
  const ev = uriEvents(), xp = ev.reduce((a, e) => a + e.xp, 0);
  let st = 0; USTAGES.forEach(([n], i) => { if (xp >= n) st = i; });
  const next = USTAGES[st + 1]?.[0], cur = USTAGES[st][0];
  const t = today(), last = ev.length ? ev[0].at : 0;
  const idle = last ? Math.max(0, dayDiff(localDay(last), t)) : 1;
  const fedMe = S.pet?.feeds?.[me()]?.last === t, pu = partnerUid(), fedHim = pu && S.pet?.feeds?.[pu]?.last === t;
  let energy = Math.max(10, 100 - idle * 25);
  if (!fedMe && !fedHim && idle === 0) energy = Math.min(energy, 85);
  const h = new Date().getHours();
  let mood = energy <= 50 ? "sad" : !fedMe ? "hungry" : (fedHim || !pu) ? "happy" : "normal";
  if ((h >= 23 || h < 6) && !S.uriAwake) mood = "sleep";
  return { ev, xp, st, next, cur, energy, mood, fedMe, fedHim, idle };
}
/* はじめて開いたとき、うり坊を生まれたてにする（それまでのごはんの回数は「生まれる前」の分として差し引く） */

function hashStr(t){ let h = 2166136261; for (const c of t) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
let qOrderCache = null;
function qOrder(){
  if (qOrderCache && qOrderCache.room === S.roomId) return qOrderCache.o;
  let seed = hashStr(S.roomId || "uri") || 1; const rnd = () => (seed = Math.imul(seed ^ (seed >>> 15), 2246822507) + 0x9e3779b9 >>> 0) / 4294967296;
  const o = QS.map((_, i) => i); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
  qOrderCache = { room: S.roomId, o }; return o;
}
function qOf(day){ const doc0 = S.qa[day]; if (doc0?.q) return doc0.q; const n = dayDiff("2026-01-01", day); const o = qOrder(); return QS[o[((n % o.length) + o.length) % o.length]]; }

const AKINDS = [["bd", "🎂", "誕生日"], ["an", "💝", "記念日"], ["ot", "⭐", "その他"]];
const akindOf = k => AKINDS.find(x => x[0] === k) || AKINDS[2];
const annivs = () => Array.isArray(S.room?.annivs) ? S.room.annivs : [];
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
function occ(d, y){ let md = d.slice(5); if (md === "02-29" && !isLeap(y)) md = "02-28"; return `${y}-${md}`; }
function nextOcc(d){ const t = today(), y = +t.slice(0, 4); const o = occ(d, y); return o >= t ? o : occ(d, y + 1); }
function annivSub(a, o){
  const n = +o.slice(0, 4) - +a.d.slice(0, 4);
  if (n <= 0) return akindOf(a.k)[2];
  return a.k === "bd" ? `${n}歳の誕生日` : a.k === "an" ? `${n}周年` : `${n}回目`;
}
function leftTag(o){ const left = dayDiff(today(), o); return `<span class="tag ${left === 0 ? "" : "lav"}">${left === 0 ? "今日🎉" : "あと" + left + "日"}</span>`; }
function annivItem(a, o){
  return `<div class="aitem" data-a="annivEdit" data-id="${a.id}"><div class="e">${akindOf(a.k)[1]}</div><div class="main"><div class="t">${esc(a.t)}</div><div class="s">${esc(fmtShort(o))} ・ ${esc(annivSub(a, o))}</div></div>${leftTag(o)}</div>`;
}
function annivUpcomingHtml(){
  const list = annivs().map(a => ({ a, o: nextOcc(a.d) })).sort((x, y) => x.o.localeCompare(y.o));
  if (!list.length) return `<div class="card anniv-empty"><span style="font-size:22px">🎂</span><span class="muted">誕生日などの記念日を登録すると、ここに出ます</span><button class="btn sub sm" data-a="annivAdd">登録</button></div>`;
  return `<div class="card"><h2>🎂 これからの記念日<button class="linkbtn" style="margin-left:auto;padding:0;font-weight:400" data-a="annivs">管理 ›</button></h2>${list.slice(0, 3).map(x => annivItem(x.a, x.o)).join("")}</div>`;
}
/* その日にある記念日（カレンダー用） */
function annivOn(d){
  const out = [], y = +d.slice(0, 4);
  annivs().forEach(a => { if (d > a.d && occ(a.d, y) === d) out.push({ id: a.id, e: akindOf(a.k)[1], t: a.t, s: annivSub(a, d) }); else if (d === a.d) out.push({ id: a.id, e: akindOf(a.k)[1], t: a.t, s: akindOf(a.k)[2] }); });
  const since = S.room?.since;
  if (since && d > since) {
    const n = y - +since.slice(0, 4);
    if (n >= 1 && occ(since, y) === d) out.push({ e: "💞", t: `付き合って${n}周年`, s: "付き合った日" });
    const dd = dayDiff(since, d) + 1;
    if (dd % 100 === 0) out.push({ e: "💞", t: `付き合って${dd.toLocaleString()}日目`, s: "付き合った日" });
  }
  return out;
}
function openAnnivs(){
  const list = annivs().map(a => ({ a, o: nextOcc(a.d) })).sort((x, y) => x.o.localeCompare(y.o));
  openSheet(`<h3>💝 記念日<button class="x" data-a="close">×</button></h3>
  <p class="muted" style="margin-top:-4px">登録した記念日は、毎年ホームとカレンダーに出ます。ふたりで同じ表示になります。</p>
  <div class="menu"><button data-a="since">💞 付き合った日<span class="r">${S.room.since ? esc(fmtDate(S.room.since)) : "未登録"} ›</span></button></div>

}

/* =============== つぶやきの古いデータを消す（1回だけ） =============== */
async function cleanupPosts(roomId){
  const key = "uri_posts_cleaned_" + roomId;
  try { if (localStorage.getItem(key)) return; } catch {}
  try {
    let left = 0;
    for (const c of ["posts", "postPhotos"]) {
      const snap = await getDocs(collection(db, "rooms", roomId, c));
      for (const d of snap.docs) { try { await deleteDoc(d.ref); } catch { left++; } }
    }
    if (!left) try { localStorage.setItem(key, "1"); } catch {}
  } catch {}
}

function viewCal(){
  if (S.extraErr) return extraNote();
  const t = today();
  if (S.calY == null) { S.calY = +t.slice(0, 4); S.calM = +t.slice(5, 7); }
  if (!S.calSel) S.calSel = t;
  const y = S.calY, m = S.calM, first = `${y}-${pad2(m)}-01`;
  const startW = wdOf(first), dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const weeks = Math.ceil((startW + dim) / 7), start = addDays(first, -startW);
  const byDay = {}; S.dates.forEach(d => (byDay[d.date] ||= []).push(d));
  let cells = "";
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i), w = i % 7, inM = +d.slice(5, 7) === m;
    cells += `<button class="cal-d ${inM ? "" : "out"} ${d === t ? "today" : ""} ${d === S.calSel ? "sel" : ""} ${w === 0 ? "sun" : w === 6 ? "sat" : ""}" data-a="calday" data-v="${d}"><span class="n">${+d.slice(8, 10)}</span><span class="dots">${[...(byDay[d] || []).map(() => "<i></i>"), ...annivOn(d).map(() => `<i class="a"></i>`)].slice(0, 3).join("")}</span></button>`;
  }
  const selList = (byDay[S.calSel] || []).sort(dateSort), selAnn = annivOn(S.calSel);

  return `<div class="card">
    <div class="cal-head"><button class="cal-nav" data-a="calmove" data-v="-1" aria-label="前の月">‹</button><b>${y}年 ${m}月</b><button class="cal-nav" data-a="calmove" data-v="1" aria-label="次の月">›</button></div>
    <div class="cal-grid">${[...WD].map((w, i) => `<div class="cal-w ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</div>`).join("")}${cells}</div>

  return `<p class="muted" style="margin-top:-6px">1問ごとに「自分の答え」と「${esc(pName())}がえらびそうな答え」を選びます。ふたりとも終わると、<b>相性◯%</b>と<b>当てっこの点数</b>が出ます。答えは、ふたりとも終わるまで見えません。</p>
  ${QSETS.map(s => {
    const mine = qDone(s.id, me()), his = qDone(s.id, pu);
    const st = mine && his ? `<span class="tag">結果が出たよ♡</span>` : mine ? `<span class="tag gray">${esc(pName())}を待っています</span>` : his ? `<span class="tag lav">${esc(pName())}は回答ずみ！</span>` : `<span class="tag gray">${s.q.length}問</span>`;
    return `<div class="qset" data-a="qset" data-v="${s.id}"><div class="cat" style="background:${s.c}">${s.e}</div><div class="main"><div class="t">${s.n}</div><div class="who">${st}</div></div><span class="r">›</span></div>`;
  }).join("")}`;
}
function startQuiz(id){ S.qv = { v: "play", set: id, i: 0, step: 0, a: [], g: [] }; renderQuiz(); }
function quizPlayHtml(){
  const v = S.qv, s = QSETS.find(x => x.id === v.set), [q, opts] = s.q[v.i];
  const guess = v.step === 1, cur = guess ? v.g[v.i] : v.a[v.i], done = v.i * 2 + v.step;
  return `<div class="qtop"><button class="btn ghost sm" data-a="qback">‹ ${v.i === 0 && v.step === 0 ? "一覧" : "もどる"}</button><span class="muted">${s.e} ${s.n}　${v.i + 1} / ${s.q.length}</span></div>
  <div class="qbar"><i style="width:${done / (s.q.length * 2) * 100}%"></i></div>
  <div class="qq"><div class="qwho ${guess ? "lav" : ""}">${guess ? `🔮 ${esc(pName())}はどれをえらぶ？` : "🙋 あなたは？"}</div><div class="qt">${esc(q)}</div></div>
  <div class="qopts">${opts.map((o, k) => `<button class="qopt ${guess ? "g" : ""} ${cur === k ? "on" : ""}" data-a="qpick" data-v="${k}">${esc(o)}</button>`).join("")}</div>`;
}
function quizPick(k, el){
  const v = S.qv; if (!v || v.v !== "play" || v.lock) return;
  v.lock = true; el.classList.add("on");
  (v.step ? v.g : v.a)[v.i] = k;
  setTimeout(() => {
    v.lock = false;
    const n = QSETS.find(x => x.id === v.set).q.length;
    if (v.step === 0) v.step = 1; else { v.step = 0; v.i++; }
    if (v.i >= n) return saveQuiz();
    renderQuiz();
  }, 220);
}
function quizBack(){
  const v = S.qv;
  if (v.step === 1) v.step = 0;
  else if (v.i > 0) { v.i--; v.step = 1; }
  else S.qv = { v: "list" };
  renderQuiz();
}
async function saveQuiz(){
  const v = S.qv;
  document.getElementById("qbody").innerHTML = `<div class="center" style="padding:40px 0"><div class="spinner"></div>保存中…</div>`;
  try {
    await setDoc(doc(db, "rooms", S.roomId, "quiz", v.set), { a: { [me()]: v.a }, g: { [me()]: v.g }, done: { [me()]: true }, updatedAt: serverTimestamp() }, { merge: true });
    S.qv = { v: "res", set: v.set }; renderQuiz();
  } catch (e) { toast("保存できませんでした（" + (e.code || e.message) + "）"); S.qv = { v: "list" }; renderQuiz(); }
}
function quizResultHtml(id){
  const s = QSETS.find(x => x.id === id), d = qDoc(id), pu = partnerUid(), A = d.a || {}, G = d.g || {};
  const back = `<div class="qtop"><button class="btn ghost sm" data-a="qlist">‹ 一覧</button><span class="muted">${s.e} ${s.n}</span></div>`;
  if (!qDone(id, me())) return back + `<button class="btn block" data-a="qstart" data-v="${id}">はじめる</button>`;
  if (!qDone(id, pu)) return back + `<div class="empty"><div class="big">⏳</div><p><b>${esc(pName())}の回答を待っています</b></p><p>${pu ? "ふたりとも答えたら、相性と当てっこの結果が出ます" : "恋人が参加したら、やってもらってね"}</p></div>
    <button class="btn ghost block" data-a="qstart" data-v="${id}">自分の答えをやり直す</button>`;
  const am = A[me()] || [], ap = A[pu] || [], gm = G[me()] || [], gp = G[pu] || [], n = s.q.length;
  const same = s.q.filter((_, i) => am[i] === ap[i]).length, pct = Math.round(same / n * 100);
  const myHit = s.q.filter((_, i) => gm[i] === ap[i]).length, hisHit = s.q.filter((_, i) => gp[i] === am[i]).length;
  const msg = pct >= 90 ? "運命のふたり！💘" : pct >= 70 ? "相性ばっちり♡" : pct >= 50 ? "いい感じのふたり☺️" : pct >= 30 ? "ちがいも楽しめるふたり" : "正反対だからおもしろい！";
  const win = myHit === hisHit ? "引き分け！どっちも相手のことよく見てるね" : `${esc(nameOf(myHit > hisHit ? me() : pu))}の勝ち！🏆`;
  return back + `<div class="qres-top"><div class="muted">${esc(nameOf(me()))} と ${esc(nameOf(pu))} の相性</div><div class="score">${pct}<small>%</small></div><div class="qmsg">${msg}</div><div class="muted" style="font-size:12px">${n}問中 ${same}問がおなじ答え</div></div>
  <div class="card" style="text-align:center"><h2 style="justify-content:center">🔮 当てっこクイズ</h2>
    <div class="vs"><div><b>${myHit}</b><span>${esc(nameOf(me()))}</span></div><div class="muted">VS</div><div><b>${hisHit}</b><span>${esc(nameOf(pu))}</span></div></div>
    <div style="font-weight:700;color:var(--lav-d)">${win}</div><div class="muted" style="font-size:12px">相手の答えを何問当てたか</div></div>
  <div class="sec">答え合わせ</div>
  ${s.q.map(([q, o], i) => `<div class="qrow"><div class="qt2">${i + 1}. ${esc(q)}${am[i] === ap[i] ? " 💗" : ""}</div>
    <div class="qa"><span>${esc(nameOf(me()))}</span><b>${esc(o[am[i]] ?? "-")}</b>${gp[i] === am[i] ? `<em>${esc(nameOf(pu))}が当てた</em>` : ""}</div>
    <div class="qa"><span>${esc(nameOf(pu))}</span><b>${esc(o[ap[i]] ?? "-")}</b>${gm[i] === ap[i] ? `<em>${esc(nameOf(me()))}が当てた</em>` : ""}</div></div>`).join("")}
  <div class="gap"></div><button class="btn ghost block" data-a="qreset" data-v="${id}">ふたりともやり直す</button>`;
}

        const full = shrink(im, 1280, 700000), thumb = shrink(im, 360, 45000);
        await setDoc(doc(db, "rooms", S.roomId, "photos", p.id), { img: full, by: me(), updatedAt: serverTimestamp() });
        data.photo = thumb;
      } else if (remove) {
        data.photo = deleteField();
        deleteDoc(doc(db, "rooms", S.roomId, "photos", p.id)).catch(() => {});
      }
      await updateDoc(doc(db, "rooms", S.roomId, "places", p.id), data);
      closeSheet(); toast(p.visited ? "保存しました" : "おもいでに追加しました📷");
    } catch (e) { document.getElementById("verr").textContent = "保存できませんでした（" + (e.code || e.message) + "）"; btn.disabled = false; btn.textContent = "保存する"; }
  };
}

  document.getElementById("ivf").onsubmit = async ev => {
    ev.preventDefault();
    const email = normEmail(new FormData(ev.target).get("email"));

    if (!emailOk(email)) return er.textContent = "メールアドレスの形がちがうみたい";

}

/* 恋人のメールアドレスを登録・変更・取り消し（ルームと招待状を同時に書く） */
async function setPartnerEmail(email){
  const old = S.room.partnerEmail || "";
  const b = writeBatch(db);
  b.update(doc(db, "rooms", S.roomId), { partnerEmail: email });
  if (old && old !== email) b.delete(doc(db, "invites", old));
  if (email) b.set(doc(db, "invites", email), { roomId: S.roomId, fromName: S.profile.name, createdAt: serverTimestamp() });
  await b.commit();
}

  openSheet(`
  <h3>🔑 パスワードを設定<button class="x" data-a="close">×</button></h3>
  <p class="muted" style="margin-top:-4px">パスワードを作っておくと、ホーム画面のアプリでもすぐログインできます。メールアドレスは ${esc(S.user.email)} です。</p>
  <form id="pwf">
    <input type="email" name="u" autocomplete="username" value="${esc(S.user.email)}" hidden>
    <label class="f"><span>新しいパスワード（6文字以上）</span><input class="in" type="password" name="p1" autocomplete="new-password" minlength="6" required></label>
    <label class="f"><span>もう一度</span><input class="in" type="password" name="p2" autocomplete="new-password" minlength="6" required></label>
    <div class="err" id="pwerr"></div>
    <button class="btn block">設定する</button>
  </form>`);
  document.getElementById("pwf").onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target), p1 = String(f.get("p1")), p2 = String(f.get("p2")), er = document.getElementById("pwerr");
    if (p1 !== p2) return er.textContent = "2つのパスワードがちがうみたい";
    const b = ev.target.querySelector("button"); b.disabled = true;
    try {
      const u = auth.currentUser;
      if ((u.providerData || []).some(p => p.providerId === "password")) await updatePassword(u, p1);
      else await linkWithCredential(u, EmailAuthProvider.credential(u.email, p1));
      closeSheet(); toast("パスワードを設定しました🔑");
    } catch (e) {
      er.textContent = e.code === "auth/requires-recent-login"
        ? "安全のため、一度ログアウトして、もう一度ログインしてから設定してね"
        : authMsg(e);
      b.disabled = false;
    }
  };
}

function openSince(){
  const v = S.room.since || "";
  openSheet(`
  <h3>💞 付き合った日<button class="x" data-a="close">×</button></h3>
  <p class="muted" style="margin-top:-4px">登録すると「付き合って○日目」と、次の記念日（100日ごと・○周年）まであと何日かが出ます。ふたりで同じ表示になります。</p>
  <form id="sf"><label class="f"><span>付き合った日</span><input class="in" type="date" name="d" value="${esc(v)}" max="${today()}" required></label>
  <button class="btn block">保存する</button></form>
  ${v ? `<div style="text-align:center;margin-top:8px"><button class="linkbtn" data-a="sinceClear">登録を消す</button></div>` : ""}`);
  document.getElementById("sf").onsubmit = async ev => {
    ev.preventDefault();
    const d = String(new FormData(ev.target).get("d")); if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    try { await updateDoc(doc(db, "rooms", S.roomId), { since: d }); closeSheet(); toast("登録しました💞"); }
    catch (e) { toast("保存できませんでした（" + (e.code || e.message) + "）"); }
  };
}

function confirmSheet(title, text, okLabel, act, danger = true){
  openSheet(`<h3>${title}<button class="x" data-a="close">×</button></h3><p>${text}</p>
  <button class="btn ${danger ? "danger" : ""} block" data-a="${act}">${okLabel}</button><div class="gap"></div><button class="btn ghost block" data-a="close">やめる</button>`);
}

/* =============== ボタンが押されたとき =============== */
let pendingDel = null, pendingDate = null, pendingQuiz = null, pendingAnniv = null, pendingTk = null;
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a === "ovclose") { if (ev.target === el) closeSheet(); return; }
  if (a === "vote" || a === "open") ev.stopPropagation();
  switch (a) {
    case "close": closeSheet(); break;
    case "reload": location.reload(); break;
    case "mode": S.authMode = el.dataset.v; S.openPw = true; renderLogin(); break;
    case "resend": LOGIN.sent = false; renderLogin(); break;
    case "google": {
      const pv = new GoogleAuthProvider(); pv.setCustomParameters({ prompt: "select_account" });
      try { await signInWithPopup(auth, pv); }
      catch (e) {
        if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment"].includes(e.code)) await signInWithRedirect(auth, pv);
        else if (!["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(e.code)) toast(authMsg(e));
      }
      break;
    }
    case "forgot": {
      const email = document.querySelector("#authf [name=email]").value.trim();
      if (!email) { document.getElementById("aerr").textContent = "上にメールアドレスを入れてから押してね"; break; }
      try { await sendPasswordResetEmail(auth, email); document.getElementById("aerr").textContent = ""; toast("パスワードを作るメールを送りました"); document.getElementById("aerr").insertAdjacentHTML("afterend", `<p class="muted" style="font-size:12px">${esc(email)} にメールを送りました。メールのリンクから新しいパスワードを決めたら、ここに戻って、そのパスワードでログインしてね。届かないときは迷惑メールも見てね。</p>`); }
      catch (e) { document.getElementById("aerr").textContent = authMsg(e); }
      break;
    }
    case "logout": stopSubs(); closeSheet(); await signOut(auth); break;
    case "createRoom": createRoom(); break;
    case "join": joinRoom(); break;
    case "joinCancel": S.skipInvite = S.invite?.roomId; S.invite = null; route(); break;
    case "recheck": { el.disabled = true; const inv = await findInvite(); if (inv && inv.roomId) renderJoin(inv); else { el.disabled = false; toast("まだ招待は届いていないみたい"); } break; }
    case "tab": if (el.dataset.v === "memo" && S.tab !== "memo") S.notesPrev = notesSeenAt(); S.tab = el.dataset.v; S.noteEdit = null; render(); window.scrollTo(0, 0); break;
    case "who": S.who = el.dataset.v; render(); break;
    case "goWho": S.who = el.dataset.v; S.tab = "list"; render(); window.scrollTo(0, 0); break;
    case "noteEdit": S.noteEdit = id; refreshNotes(id); break;
    case "noteCancel": S.noteEdit = null; refreshNotes(id); break;
    case "noteDel": try { await saveNote(id, ""); toast("消しました"); } catch (e) { toast("消せませんでした（" + (e.code || e.message) + "）"); } break;
    case "annivs": openAnnivs(); break;
    case "qaEdit": S.qaEdit = true; render(); document.querySelector(".qaform textarea")?.focus(); break;
    case "qaCancel": S.qaEdit = false; render(); break;
    case "qaHist": openQaHist(); break;
    case "uriTap": uriTap(); break;
    case "uriFeed": uriFeed(el); break;
    case "uriInfo": openUriInfo(); break;
    case "uriName": openUriName(); break;
    case "planDel": { const d = S.dates.find(x => x.id === id); if (d) saveShiori(id, { plan: (d.plan || []).filter((_, i) => i !== +el.dataset.v) }); break; }
    case "itemToggle": { const d = S.dates.find(x => x.id === id); if (d) saveShiori(id, { items: (d.items || []).map((x, i) => i === +el.dataset.v ? { ...x, done: !x.done } : x) }); break; }
    case "itemDel": { const d = S.dates.find(x => x.id === id); if (d) saveShiori(id, { items: (d.items || []).filter((_, i) => i !== +el.dataset.v) }); break; }
    case "tickets": openTickets(el.dataset.v); break;
    case "tkTab": openTickets(el.dataset.v); break;
    case "tkNew": openTicketNew(); break;
    case "tkUse": pendingTk = id; confirmSheet("このチケットを使う？", "使うと、" + esc(pName()) + "のホームにお知らせが出ます。", "使う！", "tkUseOk", false); break;
    case "tkUseOk":
      try { await updateDoc(doc(db, "rooms", S.roomId, "tickets", pendingTk), { status: "used", usedAt: Date.now() }); toast("チケットを使いました🎟"); openTickets("got"); }
      catch (e) { toast("うまくいきませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "tkDone":
      try { await updateDoc(doc(db, "rooms", S.roomId, "tickets", id), { status: "done", doneAt: Date.now() }); toast("かなえました♡"); }
      catch (e) { toast("うまくいきませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "tkDel": pendingTk = id; confirmSheet("チケットを取り消す？", "まだ使われていないチケットを取り消します。", "取り消す", "tkDelOk"); break;
    case "tkDelOk":
      try { await deleteDoc(doc(db, "rooms", S.roomId, "tickets", pendingTk)); toast("取り消しました"); openTickets("gave"); }
      catch (e) { toast("うまくいきませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "annivAdd": openAnnivEdit(null); break;
    case "annivEdit": openAnnivEdit(id); break;
    case "annivDel": pendingAnniv = id; confirmSheet("記念日を消しますか？", "ふたりの画面から消えます。", "消す", "annivDelOk"); break;
    case "annivDelOk":
      try { const arr = annivs().filter(x => x.id !== pendingAnniv); await updateDoc(doc(db, "rooms", S.roomId), { annivs: arr }); S.room.annivs = arr; toast("消しました"); openAnnivs(); }
      catch (e) { toast("消せませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "cat": S.cat = el.dataset.v; render(); break;
    case "add": openEdit(); break;
    case "open": openDetail(id); break;
    case "edit": openEdit(id); break;
    case "vote": {
      const p = S.places.find(x => x.id === id); if (!p) break;
      const on = !votesOf(p).includes(me());
      el.classList?.toggle("on", on);
      try { await updateDoc(doc(db, "rooms", S.roomId, "places", id), { ["votes." + me()]: on ? true : deleteField() }); }
      catch (e) { toast("保存できませんでした（" + (e.code || e.message) + "）"); }
      if (document.querySelector(".detail")) openDetail(id);
      break;
    }
    case "visit": case "visitEdit": openVisit(id); break;
    case "unvisit":
      try { await updateDoc(doc(db, "rooms", S.roomId, "places", id), { visited: false, visitedAt: deleteField(), visitNote: deleteField(), updatedAt: serverTimestamp() }); closeSheet(); toast("「行きたい」に戻しました"); }
      catch (e) { toast("保存できませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "del": {
      const p = S.places.find(x => x.id === id); if (!p) break;
      pendingDel = id;
      confirmSheet("削除しますか？", `「${esc(p.title)}」を削除します。ふたりのリストから消えて、元に戻せません。`, "削除する", "delOk");
      break;
    }
    case "delOk":
      try { deleteDoc(doc(db, "rooms", S.roomId, "photos", pendingDel)).catch(() => {}); await deleteDoc(doc(db, "rooms", S.roomId, "places", pendingDel)); closeSheet(); toast("削除しました"); }
      catch (e) { toast("削除できませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "settings": openSettings(); break;
    case "invite": openInvite(); break;
    case "share":
      try { await navigator.share({ title: "ウリログ", text: inviteText(S.room.partnerEmail) }); } catch {}
      break;
    case "copy":
      try { await navigator.clipboard.writeText(inviteText(S.room.partnerEmail)); toast("コピーしました"); }
      catch { toast("コピーできませんでした。長押ししてコピーしてね"); }
      break;
    case "uninvite":
      try { await setPartnerEmail(""); toast("招待を取り消しました"); setTimeout(openInvite, 250); }
      catch (e) { toast("取り消せませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "rename": openRename(); break;
    case "setpw": openSetPw(); break;
    case "since": openSince(); break;
    case "sinceClear":
      try { await updateDoc(doc(db, "rooms", S.roomId), { since: deleteField() }); closeSheet(); toast("消しました"); }
      catch (e) { toast("消せませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "dateAdd": openDateEdit(null, { placeId: el.dataset.pid || "", date: S.tab === "cal" && S.calSel >= today() ? S.calSel : "" }); break;
    case "dateOpen": openDateEdit(id); break;
    case "dateDel": {
      const d = S.dates.find(x => x.id === id); if (!d) break;
      pendingDate = id;
      confirmSheet("予定を消しますか？", `${esc(fmtShort(d.date))}「${esc(dateTitle(d))}」の予定を消します。`, "消す", "dateDelOk");
      break;
    }
    case "dateDelOk":
      try { await deleteDoc(doc(db, "rooms", S.roomId, "dates", pendingDate)); closeSheet(); toast("消しました"); }
      catch (e) { toast("消せませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "calday": {
      const v = el.dataset.v; S.calSel = v;
      if (+v.slice(5, 7) !== S.calM) { S.calY = +v.slice(0, 4); S.calM = +v.slice(5, 7); }
      document.getElementById("view").innerHTML = viewCal(); break;
    }
    case "calmove": {
      const dt = new Date(Date.UTC(S.calY, S.calM - 1 + Number(el.dataset.v), 1));
      S.calY = dt.getUTCFullYear(); S.calM = dt.getUTCMonth() + 1;
      document.getElementById("view").innerHTML = viewCal(); break;
    }
    case "caltoday": S.calY = null; S.calSel = today(); document.getElementById("view").innerHTML = viewCal(); break;
    case "quiz": openQuiz(); break;
    case "qset": { const sid = el.dataset.v; if (qDone(sid, me())) { S.qv = { v: "res", set: sid }; renderQuiz(); } else startQuiz(sid); break; }
    case "qstart": startQuiz(el.dataset.v); break;
    case "qpick": quizPick(Number(el.dataset.v), el); break;
    case "qback": quizBack(); break;
    case "qlist": S.qv = { v: "list" }; renderQuiz(); break;
    case "qreset": pendingQuiz = el.dataset.v; confirmSheet("ふたりともやり直す？", "このテストのふたりの答えを消して、最初からやり直します。", "やり直す", "qresetOk"); break;
    case "qresetOk":
      try { await deleteDoc(doc(db, "rooms", S.roomId, "quiz", pendingQuiz)); closeSheet(); openQuiz(); }
      catch (e) { toast("うまくいきませんでした（" + (e.code || e.message) + "）"); }
      break;
    case "swipe": openSwipe(); break;
    case "swregion": S.swRegion = el.dataset.v; openSwipe(); break;
    case "sw": swipeOut(el.dataset.v === "1"); break;
    case "unpass": unpass(); break;
    case "fxclose": document.getElementById("fx").innerHTML = ""; break;
    case "fxopen": document.getElementById("fx").innerHTML = ""; S.tab = "list"; S.who = "both"; render(); openDetail(id); break;
    case "zoom": { const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img src="${el.src}" alt="">`; z.onclick = () => z.remove(); document.body.appendChild(z); break; }
    case "leave":
      confirmSheet("ルームから抜けますか？", isPaired() ? "抜けると、ふたりのリストが見られなくなります。もう一度入るには、恋人にもう一度メールアドレスを登録してもらう必要があります。" : "抜けると、このルームのリストは見られなくなります。", "抜ける", "leaveOk");
      break;
    case "leaveOk":
      try {
        const rid = S.roomId; stopSubs();
        await leaveRoomDoc(rid);
        await setDoc(doc(db, "users", me()), { roomId: deleteField() }, { merge: true });
        S.profile.roomId = null; S.room = null; S.roomId = null; closeSheet(); toast("ルームから抜けました"); route();
      } catch (e) { toast("抜けられませんでした（" + (e.code || e.message) + "）"); if (S.profile.roomId) openRoom(S.profile.roomId); }
      break;
  }
});
document.addEventListener("submit", async ev => {
  const qf = ev.target.closest(".qaform");
  if (qf) {
    ev.preventDefault(); const b = qf.querySelector("button:not([type=button])"); b.disabled = true;
    try { await saveQa(qf.t.value); } catch (e) { toast(e.code === "permission-denied" ? "答えられませんでした。Firebaseのルール更新が必要です" : "答えられませんでした（" + (e.code || e.message) + "）"); b.disabled = false; }
    return;
  }
  const sf = ev.target.closest(".sform");
  if (sf) {
    ev.preventDefault(); const d = S.dates.find(x => x.id === sf.dataset.id); if (!d) return;
    const tx = String(sf.tx.value || "").trim(); if (!tx) return;
    if (sf.dataset.k === "plan") await saveShiori(d.id, { plan: [...(d.plan || []), { tm: String(sf.tm.value || ""), tx: tx.slice(0, 60) }] });
    else await saveShiori(d.id, { items: [...(d.items || []), { tx: tx.slice(0, 40), done: false }] });
    document.querySelector(`#shiori .sform[data-k="${sf.dataset.k}"] input[name=tx]`)?.focus();
    return;
  }
  const f = ev.target.closest(".nform"); if (!f) return;
  ev.preventDefault();
  const b = f.querySelector("button:not([type=button])"); b.disabled = true;
  try { await saveNote(f.dataset.id, f.t.value); toast("保存しました"); }
  catch (e) { toast("保存できませんでした（" + (e.code || e.message) + "）"); b.disabled = false; }
});
document.addEventListener("change", ev => {
  if (ev.target.matches("select[data-a=sort]")) { S.sort = ev.target.value; render(); }
});
</script>
</body>
