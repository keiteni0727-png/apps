<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#fff5f8; --card:#ffffff; --pink:#f48fb1; --pink-d:#e46f98; --pink-l:#fde4ec; --pink-xl:#fff0f5;
  --text:#5b3b47; --muted:#a8899a; --line:#f6d6e1; --ok:#7cc7a8; --warn:#f2a65a;
  --r:22px; --shadow:0 6px 20px rgba(228,111,152,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}
.logo{font-weight:700;font-size:22px;color:var(--pink-d);display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.logo svg{width:22px;height:22px}
.badge{font-size:11px;background:var(--pink-l);color:var(--pink-d);padding:3px 9px;border-radius:99px;margin-left:6px;font-weight:500}
.iconbtn{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:var(--pink-d)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px;color:var(--pink-d)}
.card h2 .sub{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.cheer{background:linear-gradient(135deg,#ffd6e5,#ffeef4 60%,#fff);position:relative;overflow:hidden}
.cheer p{margin:4px 0 0;font-size:15px}
.cheer .hello{font-weight:700;font-size:17px}
.cheer .deco{position:absolute;right:-6px;top:-8px;width:84px;opacity:.35}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.stat .label{font-size:12px;color:var(--muted)}
.stat .val{font-size:24px;font-weight:700}
.stat .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.bar{height:9px;background:var(--pink-l);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#f8a9c6,var(--pink-d));border-radius:99px}
.muted{color:var(--muted);font-size:13px}
.btn{border:0;background:var(--pink-d);color:#fff;border-radius:99px;padding:11px 18px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(228,111,152,.3)}
.btn.sub{background:var(--pink-l);color:var(--pink-d);box-shadow:none}
.btn.ghost{background:transparent;color:var(--pink-d);box-shadow:none;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.sm{padding:7px 13px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.list li:first-child{border-top:0}
.list .main{flex:1;min-width:0}
.list .t{font-weight:500}
.list .s{font-size:12px;color:var(--muted)}
.thumb{width:52px;height:52px;border-radius:14px;object-fit:cover;background:var(--pink-xl);flex:none}
.del{border:0;background:none;color:#d7b3c1;font-size:18px;cursor:pointer;padding:4px 6px}
.dayhead{font-size:13px;color:var(--pink-d);font-weight:700;margin:4px 0 2px;display:flex;justify-content:space-between}
.chip{display:inline-block;font-size:12px;background:var(--pink-xl);color:var(--pink-d);border-radius:99px;padding:2px 9px;margin:2px 3px 0 0}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(env(safe-area-inset-bottom) + 86px);border:0;background:var(--pink-d);color:#fff;width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 8px 20px rgba(228,111,152,.45);cursor:pointer;z-index:5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:6}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;padding:4px 0}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor}
nav.tabs button.on{color:var(--pink-d);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(91,59,71,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 12px;color:var(--pink-d);font-size:17px;display:flex;justify-content:space-between;align-items:center}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--pink-xl);outline:none;font-size:16px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--pink)}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{font-size:13px;border:1.5px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer}
.checks input{display:none}
.checks label:has(input:checked){background:var(--pink-d);border-color:var(--pink-d);color:#fff}
.switch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.switch:first-of-type{border-top:0}
.switch input{width:46px;height:26px;appearance:none;background:#ead3dc;border-radius:99px;position:relative;cursor:pointer;transition:.2s}
.switch input::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.switch input:checked{background:var(--pink-d)}
.switch input:checked::after{left:22px}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.big-heart{width:86px;height:86px;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(.98)}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block}
.photos figcaption{font-size:11px;color:var(--muted);text-align:center}
.photos .del{position:absolute;top:2px;right:2px;background:rgba(255,255,255,.85);border-radius:50%;width:26px;height:26px;padding:0;font-size:14px}
.water-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.note{background:var(--pink-xl);border-radius:14px;padding:10px 12px;font-size:13px}
.note.warn{background:#fff4e8;color:#9a6233}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.92}
svg.chart{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 0}
.lockbox{text-align:center}
.lockbox svg{width:46px;height:46px;stroke:var(--pink-d)}
/* ===== デイリーミッション・ガチャ ===== */
.mis{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.mis:first-of-type{border-top:0}
.mis .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;color:#fff}
.mis.done .ck{background:var(--ok);border-color:var(--ok)}
.mis .main{flex:1}
.mis .got{font-size:12px;color:var(--muted)}
.tix{display:inline-flex;align-items:center;gap:4px;background:#fff3c9;color:#a77a12;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700}
.gift{background:linear-gradient(135deg,#fff3c9,#fff9e8);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-top:10px}
.gacha-top{text-align:center;background:linear-gradient(160deg,#ffd6e5,#fff4f8 55%,#fff)}
.machine{width:150px;height:auto;margin:4px auto 6px;display:block}
.tixbig{font-size:30px;font-weight:700;color:var(--pink-d)}
.zukan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.zk{background:var(--pink-xl);border-radius:16px;padding:8px 6px 6px;text-align:center;position:relative}
.zk .pic{width:100%;aspect-ratio:1;display:grid;place-items:center}
.zk .pic svg,.zk .pic img{width:88%;height:88%;object-fit:contain;border-radius:12px}
.zk .nm{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zk .cnt{position:absolute;top:4px;right:6px;font-size:11px;color:var(--pink-d);font-weight:700}
.zk.no .pic svg,.zk.no .pic img{filter:brightness(0);opacity:.13}
.zk.no .nm{color:var(--muted)}
.rar{display:inline-block;font-size:10px;font-weight:700;border-radius:99px;padding:0 7px;margin-top:2px}
.rar.N{background:#eee;color:#888}.rar.R{background:#dff0ff;color:#3d7fc0}.rar.SR{background:linear-gradient(90deg,#ffe58a,#ffb3cf);color:#8a4b00}
.zk.SR{background:linear-gradient(160deg,#fff6d6,#ffe9f2)}
.reveal{text-align:center;padding:10px 0 4px}
.reveal .pic{width:190px;height:190px;margin:0 auto;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.reveal .pic svg,.reveal .pic img{width:100%;height:100%;object-fit:contain;border-radius:22px}
.reveal .nm{font-size:22px;font-weight:700;margin-top:6px}
.reveal .tag{display:inline-block;margin-top:6px;background:var(--pink-d);color:#fff;border-radius:99px;padding:3px 12px;font-weight:700;font-size:13px}
.reveal .tag.dup{background:var(--pink-l);color:var(--pink-d)}
.cap{width:120px;margin:24px auto;display:block;animation:shake .35s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.sparkle{position:relative}
.sparkle::before,.sparkle::after{content:"♡";position:absolute;color:var(--pink);font-size:22px;animation:float 1.6s ease-in-out infinite}
.sparkle::before{left:18%;top:10%}.sparkle::after{right:18%;top:24%;animation-delay:.5s}
@keyframes float{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-10px);opacity:1}}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pickgrid button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:6px;cursor:pointer}
.pickgrid button svg,.pickgrid button img{width:100%;aspect-ratio:1;object-fit:contain}
.cropbox{position:relative;overflow:hidden;border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none;background:#f3eef0}
.cropbox img{width:100%;display:block;pointer-events:none}
.cropbox .sel{position:absolute;border:2.5px solid #fff;border-radius:10px;box-shadow:0 0 0 9999px rgba(91,59,71,.45);pointer-events:none}
.cropbox .hd{position:absolute;right:-13px;bottom:-13px;width:26px;height:26px;border-radius:50%;background:var(--pink-d);border:3px solid #fff}
.cropfoot{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.cropfoot canvas{width:110px;height:110px;border-radius:14px;flex:none;box-shadow:var(--shadow)}
.filebtn{position:relative;overflow:hidden;display:block;text-align:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>
</head>

  user:null, role:null, cfg:{}, share:{}, profile:{}, cheers:[], invite:null,
  data:{ meals:[], gym:[], weights:[], water:[], sleep:[] }, denied:{},
  privMeta:undefined, key:null, priv:{ logs:[], photos:[] },
  game:{}, gchars:[],

};

/* ===== 起動 ===== */
const LOGIN = { link:null, sent:false, busy:false };
const appUrl = () => location.origin + location.pathname;
const STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
// 予期しないエラーが起きたら、真っ白（ピンク）にせず画面に出す
function showFatal(msg){
  if($app.querySelector('.fatal')) return;
  $app.insertAdjacentHTML('afterbegin', `<div class="card fatal note warn" style="margin-top:12px">うまく動きませんでした。この画面のスクショを送ってね。<br><small>${esc(msg)}</small></div>`);
}
window.addEventListener('error', e => showFatal(e.message || 'error'));
window.addEventListener('unhandledrejection', e => showFatal(String(e.reason?.code || e.reason?.message || e.reason)));
$app.innerHTML = `<div class="center">${IC.heart.replace('<svg','<svg class="big-heart"')}<p class="muted">読み込み中…</p></div>`;
setTimeout(() => { if(!S.user && $app.textContent.includes('読み込み中')) $app.insertAdjacentHTML('beforeend', `<p class="muted" style="text-align:center">時間がかかっています。LINEやメールアプリの中で開いている場合は、右上のメニューから「Safariで開く」を選んでね。</p>`); }, 8000);
const configured = firebaseConfig.apiKey && firebaseConfig.apiKey !== 'PASTE_HERE';
let auth, db;
if(!configured){
  $app.innerHTML = `<div class="center">${IC.heart.replace('<svg','<svg class="big-heart"')}<h2>FitLife ♡</h2><p class="muted">Firebaseの設定がまだ入っていません。<br>index.html の firebaseConfig を設定してください。</p></div>`;
} else {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);
  // 招待リンク（#invite=...）で開かれたら、ログインが終わるまで覚えておく
  const m = (location.hash + location.search).match(/invite=([0-9a-f]{64})/);
  if(m) localStorage.setItem('fitlife_invite', m[1]);
  if(location.hash.includes('invite=')) history.replaceState(null, '', location.pathname + location.search);
  onAuthStateChanged(auth, onUser);
  // メールのリンクから開かれたとき
  if(isSignInWithEmailLink(auth, location.href)){
    LOGIN.link = location.href;
    const saved = localStorage.getItem('fitlife_email');
    if(saved){ finishEmailLink(saved, LOGIN.link).catch(err => { console.error(err); toast(authErr(err)); }); }
  }
}

async function onUser(user){
  unsub(subs); unsub(colSubs); unsub(privSubs);
  Object.assign(S, { user, role:null, cheers:[], invite:null, cfg:{}, share:{}, profile:{}, denied:{}, privMeta:undefined, key:null, priv:{logs:[],photos:[]}, game:{}, gchars:[], tab:'home' });
  S.data = { meals:[], gym:[], weights:[], water:[], sleep:[] };
  if(!user){ renderLogin(); return; }
  $app.innerHTML = `<div class="center">${IC.heart.replace('<svg','<svg class="big-heart"')}<p class="muted">読み込み中…</p></div>`;
  const readCfg = async () => { const snap = await getDoc(doc(db,'config','app')); S.cfg = snap.exists() ? snap.data() : {}; };
  try{ await readCfg(); }
  catch(e){
    // まだ参加していない人：招待リンクがあれば参加する
    const token = localStorage.getItem('fitlife_invite');
    if(!token){ renderDenied(); return; }
    localStorage.removeItem('fitlife_invite');
    try{
      const b = writeBatch(db);
      b.update(doc(db,'config','app'), { memberUid: user.uid, inviteToken: token });
      b.update(doc(db,'invites',token), { used: true, usedBy: user.uid });
      await b.commit();
      await readCfg();
      toast('参加しました ♡');
    }catch(err){ console.error(err); renderDenied(true); return; }
  }
  localStorage.removeItem('fitlife_invite');
  const myMail = (user.email||'').toLowerCase();
  S.role = ((S.cfg.memberUid && S.cfg.memberUid === user.uid) || (S.cfg.memberEmail && user.emailVerified && S.cfg.memberEmail === myMail)) ? 'member' : 'owner';
  startListeners();
  if(S.role === 'member') await loadPrivMeta();
  render();
}

function startListeners(){
  subs.push(onSnapshot(doc(db,'config','app'), s => { S.cfg = s.data()||{}; render(); }, ()=>{}));
  if(S.role === 'owner'){
    subs.push(onSnapshot(collection(db,'invites'), s => {
      const now = Date.now();
      S.invite = s.docs.map(d => ({ id:d.id, ...d.data() }))
        .filter(i => !i.used && i.expiresAt && i.expiresAt.toMillis() > now)
        .sort((a,b) => b.expiresAt.toMillis() - a.expiresAt.toMillis())[0] || null;
      render();
    }, ()=>{}));
  }
  subs.push(onSnapshot(query(collection(db,'cheers'), orderBy('ts','desc'), limit(60)), s => {
    S.cheers = s.docs.map(d => ({ id:d.id, ...d.data() })); render();
  }, ()=>{}));
  // ガチャのキャラ（オーナーが登録した画像）
  subs.push(onSnapshot(query(collection(db,'gachaChars'), orderBy('ts','desc')), s => {
    S.gchars = s.docs.map(d => ({ id:'c_' + d.id, docId:d.id, ...d.data() })); render();
  }, ()=>{}));
  if(S.role === 'member') startColListeners();
  else subs.push(onSnapshot(doc(db,'game','main'), s => { S.game = s.data()||{}; render(); }, () => { S.game = {}; }));
}

function startColListeners(){
  unsub(colSubs);
  for(const col of COLS){
    S.denied[col] = false;
    const q = query(collection(db,col), orderBy('date','desc'), limit(400));
    colSubs.push(onSnapshot(q, s => {
      S.data[col] = s.docs.map(d => ({ id:d.id, ...d.data() }))
        .sort((a,b) => a.date === b.date ? ((b.ts?.seconds||9e9) - (a.ts?.seconds||9e9)) : (a.date < b.date ? 1 : -1));
      render();
    }, () => { S.denied[col] = true; S.data[col] = []; render(); }));
  }
  colSubs.push(onSnapshot(doc(db,'profile','main'), s => { S.profile = s.data()||{}; render(); }, () => { S.profile = {}; }));
  colSubs.push(onSnapshot(doc(db,'game','main'), s => { S.game = s.data()||{}; render(); }, () => { S.game = {}; }));
}

/* ===== ミッション・ガチャのしくみ ===== */
const allChars = () => [...S.gchars].sort((a,b) => RARITY_ORDER[a.rarity] - RARITY_ORDER[b.rarity]);
const charPic = c => `<img src="${c.img}" alt="">`;
const G = () => ({ tickets:0, coll:{}, shards:0, claimed:{}, cheerDone:[], pulls:0, history:[], ...S.game });
const addHist = (g, c, kind) => { g.history = [{ id:c.id, name:c.name, rarity:c.rarity, at:Date.now(), kind }, ...(g.history || [])].slice(0, 50); };
async function saveGame(g){
  // 2週間より前の受け取り記録は消して、データを小さく保つ
  const cut = daysAgo(14);
  g.claimed = Object.fromEntries(Object.entries(g.claimed || {}).filter(([d]) => d >= cut));
  g.cheerDone = (g.cheerDone || []).slice(-100);
  S.game = g; render();
  await setDoc(doc(db,'game','main'), g);
}
const claimedToday = () => G().claimed[today()] || [];
const pendingGifts = () => { const done = new Set(G().cheerDone); return S.cheers.filter(c => c.ticket && !done.has(c.id)); };
async function claim(k){
  const g = G(), t = today(), got = [...(g.claimed[t] || [])];
  if(got.includes(k)) return;
  if(k !== 'rest'){ const m = MISSIONS.find(x => x.k === k); if(!m || !m.ok(t)) throw new Error('まだクリアしていないよ'); }
  got.push(k); let add = 1, msg = 'チケット＋1 🎟️';
  if(k !== 'rest' && MISSIONS.every(m => got.includes(m.k)) && !got.includes('bonus')){ got.push('bonus'); add++; msg = 'ぜんぶクリア！チケット＋2 🎟️'; }
  g.claimed = { ...g.claimed, [t]: got }; g.tickets = (g.tickets || 0) + add;
  await saveGame(g); toast(msg);
}
async function claimGifts(){
  const gifts = pendingGifts(); if(!gifts.length) return;
  const g = G(); g.cheerDone = [...g.cheerDone, ...gifts.map(c => c.id)]; g.tickets += gifts.length;
  await saveGame(g); toast(`${FROM}からチケット＋${gifts.length} 🎟️`);
}
function rollChar(){
  const chars = allChars();
  const tot = Object.values(RARITY_W).reduce((a,b) => a+b, 0);
  let r = Math.random() * tot, rar = 'N';
  for(const [k,w] of Object.entries(RARITY_W)){ if((r -= w) < 0){ rar = k; break; } }
  let pool = chars.filter(c => c.rarity === rar);
  if(!pool.length) pool = chars;
  return pool[Math.floor(Math.random() * pool.length)];
}
async function pullGacha(){
  const g = G();
  if(!allChars().length){ toast('まだキャラがいないよ'); return; }
  if(g.tickets < 1){ toast('チケットがないよ。ミッションでもらえるよ'); return; }
  const c = rollChar(), had = (g.coll[c.id] || 0) > 0;
  g.tickets--; g.pulls = (g.pulls || 0) + 1;
  g.coll = { ...g.coll, [c.id]: (g.coll[c.id] || 0) + 1 };
  if(had) g.shards = (g.shards || 0) + 1;
  addHist(g, c, had ? 'dup' : 'new');
  $sheet.innerHTML = `<div class="sheet-bg"><div class="sheet" style="text-align:center">${capsuleSVG()}<p class="muted">ガチャガチャ…</p></div></div>`;
  await saveGame(g);
  setTimeout(() => showResult(c, had), 1300);
}

/* ===== 暗号化（センシティブな記録用） ===== */
const TE = new TextEncoder(), TD = new TextDecoder();
const ITER = 310000;
const b64 = buf => { const b = new Uint8Array(buf); let s = ''; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', TE.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encObj(obj, key = S.key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, TE.encode(JSON.stringify(obj)));
  return { iv:b64(iv), ct:b64(ct) };
}
async function decObj(d, key = S.key){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(d.iv) }, key, unb64(d.ct));
  return JSON.parse(TD.decode(pt));
}
function idbOpen(){ return new Promise((res,rej) => { const r = indexedDB.open('fitlife',1); r.onupgradeneeded = () => r.result.createObjectStore('keys'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k,v){ const d = await idbOpen(); return new Promise((res,rej) => { const t = d.transaction('keys','readwrite'); const st = t.objectStore('keys'); v === undefined ? st.delete(k) : st.put(v,k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbGet(k){ const d = await idbOpen(); return new Promise((res,rej) => { const r = d.transaction('keys').objectStore('keys').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function loadPrivMeta(){
  try{
    const s = await getDoc(doc(db,'privateMeta','key'));
    S.privMeta = s.exists() ? s.data() : null;
    if(S.privMeta){
      const saved = await idbGet('key_' + S.user.uid).catch(()=>null);
      if(saved){
        try{ const v = await decObj(S.privMeta.verifier, saved); if(v === 'fitlife-ok'){ S.key = saved; startPrivListeners(); } }catch(e){ await idbSet('key_' + S.user.uid, undefined).catch(()=>{}); }
      }
    }
  }catch(e){ S.privMeta = null; }
}
function startPrivListeners(){
  unsub(privSubs);
  for(const [col, field] of [['privateLogs','logs'],['privatePhotos','photos']]){
    privSubs.push(onSnapshot(query(collection(db,col), orderBy('ts','desc'), limit(300)), async s => {
      const out = [];
      for(const d of s.docs){ try{ out.push({ id:d.id, ...(await decObj(d.data())) }); }catch(e){} }
      out.sort((a,b) => a.date < b.date ? 1 : -1);
      S.priv[field] = out; render();
    }, ()=>{}));
  }
}
async function setupPass(pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pass, salt, ITER);
  const meta = { salt:b64(salt), iter:ITER, verifier: await encObj('fitlife-ok', key) };
  await setDoc(doc(db,'privateMeta','key'), meta);
  S.privMeta = meta; S.key = key;
}
async function unlock(pass, remember){
  const key = await deriveKey(pass, unb64(S.privMeta.salt), S.privMeta.iter);
  try{ if(await decObj(S.privMeta.verifier, key) !== 'fitlife-ok') throw 0; }catch(e){ return false; }
  S.key = key;
  if(remember) await idbSet('key_' + S.user.uid, key).catch(()=>{});
  startPrivListeners();
  return true;
}
async function lockNow(){
  S.key = null; S.priv = { logs:[], photos:[] }; unsub(privSubs);
  await idbSet('key_' + S.user.uid, undefined).catch(()=>{});
  render();
}

/* ===== 画像の圧縮 ===== */
function fileToDataURL(file, max, q){
  return new Promise((res,rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}
async function compress(file, max, q, maxLen){
  let d = await fileToDataURL(file, max, q);
  while(d.length > maxLen && max > 320){ max = Math.round(max*0.8); q = Math.max(0.45, q-0.08); d = await fileToDataURL(file, max, q); }
  return d;
}

let CROP = null;
function openCrop(file){
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const W = img.naturalWidth, H = img.naturalHeight, size = Math.round(Math.min(W, H) * 0.8);
    CROP = { img, url, sx:(W-size)/2, sy:(H-size)/2, size, count:0 };
    $sheet.innerHTML = `<div class="sheet-bg"><div class="sheet"><h3>キャラを切り抜く<button class="del" data-a="cropclose" aria-label="閉じる">×</button></h3>
      <p class="muted" style="margin:0 0 8px">枠を動かして1体を囲んでね。右下の●で大きさを変えられます。</p>
      <div class="cropbox"><img src="${url}" alt=""><div class="sel"><div class="hd"></div></div></div>
      <form data-form="gchar"><div class="cropfoot"><canvas width="400" height="400"></canvas>
        <div style="flex:1"><label class="f" style="margin-top:0">名前</label><input class="in" name="name" required maxlength="20" placeholder="例：パンダ">
        <label class="f">レア度</label><select class="in" name="rarity"><option>N</option><option>R</option><option>SR</option></select></div></div>
        <p class="muted" id="cropcount" style="margin:8px 0 0"></p>
        <button class="btn block" style="margin-top:10px">このキャラを登録</button></form></div></div>`;
    bindCrop(); drawSel(); drawPreview();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('画像を読み込めませんでした'); };
  img.src = url;
}
function clampCrop(){
  const W = CROP.img.naturalWidth, H = CROP.img.naturalHeight;
  CROP.size = Math.max(Math.min(W, H) * 0.08, Math.min(CROP.size, W, H));
  CROP.sx = Math.max(0, Math.min(W - CROP.size, CROP.sx));
  CROP.sy = Math.max(0, Math.min(H - CROP.size, CROP.sy));
}
function drawSel(){
  const W = CROP.img.naturalWidth, H = CROP.img.naturalHeight, el = $sheet.querySelector('.sel');
  if(!el) return;
  Object.assign(el.style, { left:CROP.sx/W*100+'%', top:CROP.sy/H*100+'%', width:CROP.size/W*100+'%', height:CROP.size/H*100+'%' });
}
function bindCrop(){
  const box = $sheet.querySelector('.cropbox');
  box.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = box.getBoundingClientRect(), k = CROP.img.naturalWidth / r.width;
    const pt = ev => [(ev.clientX - r.left) * k, (ev.clientY - r.top) * k];
    const [x, y] = pt(e), { sx, sy, size } = CROP;
    let mode = Math.hypot(x - (sx+size), y - (sy+size)) < 30*k ? 'resize'
      : (x >= sx && x <= sx+size && y >= sy && y <= sy+size) ? 'move' : 'jump';
    if(mode === 'jump'){ CROP.sx = x - size/2; CROP.sy = y - size/2; clampCrop(); drawSel(); mode = 'move'; }
    const st = { x, y, sx:CROP.sx, sy:CROP.sy, size:CROP.size };
    box.setPointerCapture(e.pointerId);
    const mv = ev => { const [X, Y] = pt(ev);
      if(mode === 'move'){ CROP.sx = st.sx + X - st.x; CROP.sy = st.sy + Y - st.y; }
      else CROP.size = st.size + Math.max(X - st.x, Y - st.y);
      clampCrop(); drawSel(); };
    const up = () => { box.removeEventListener('pointermove', mv); box.removeEventListener('pointerup', up); box.removeEventListener('pointercancel', up); drawPreview(); };
    box.addEventListener('pointermove', mv); box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  });
}
function makeSticker(cv = document.createElement('canvas')){
  const N = 400; cv.width = N; cv.height = N;
  const g = cv.getContext('2d');
  const bg = g.createLinearGradient(0, 0, N, N); bg.addColorStop(0, '#ffe3ee'); bg.addColorStop(1, '#fff6dc');
  g.fillStyle = bg; g.fillRect(0, 0, N, N);
  g.font = '700 34px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  [['♡',46,52,'#ff9fc0'],['✦',356,58,'#ffcf4d'],['✦',50,350,'#b9a6ff'],['♡',352,346,'#ff9fc0'],['✦',372,200,'#ffcf4d']].forEach(([ch,x,y,c]) => { g.fillStyle = c; g.fillText(ch, x, y); });
  g.save(); g.shadowColor = 'rgba(228,111,152,.35)'; g.shadowBlur = 18; g.shadowOffsetY = 6;
  g.beginPath(); g.arc(N/2, N/2, 172, 0, Math.PI*2); g.fillStyle = '#fff'; g.fill(); g.restore();
  g.save(); g.beginPath(); g.arc(N/2, N/2, 160, 0, Math.PI*2); g.clip();
  g.fillStyle = '#fff'; g.fill();
  g.drawImage(CROP.img, CROP.sx, CROP.sy, CROP.size, CROP.size, N/2-160, N/2-160, 320, 320);
  g.restore();
  return cv;
}
const drawPreview = () => { const cv = $sheet.querySelector('.cropfoot canvas'); if(cv && CROP) makeSticker(cv); };

    html += `<div class="card"><h2>お水（7日間）${canEdit() ? `<span class="sub"><button class="btn sub sm" data-a="open" data-v="water">＋入力</button></span>` : ''}</h2>

        <line x1="10" x2="310" y1="${110 - goal/mx*95}" y2="${110 - goal/mx*95}" stroke="#f48fb1" stroke-dasharray="4 4"/>
        ${tot.map((v,i) => `<rect x="${18+i*42}" y="${110 - v/mx*95}" width="26" height="${Math.max(0,v/mx*95)}" rx="8" fill="${v >= goal ? '#e46f98' : '#f8bcd2'}"/>
          <text x="${31+i*42}" y="125" font-size="10" text-anchor="middle" fill="#a8899a">${fmtDate(days[i]).replace(/\(.\)/,'')}</text>`).join('')}
      </svg><div class="muted">点線：目標 ${goal}ml</div>
      ${canEdit() ? `<div class="water-btns"><button class="btn sub sm" data-a="water" data-v="150">＋150ml</button><button class="btn sub sm" data-a="water" data-v="200">＋200ml</button><button class="btn sub sm" data-a="water" data-v="500">＋500ml</button></div>` : ''}
      ${S.data.water.filter(x => x.date === today()).length && canEdit() ? `<ul class="list" style="margin-top:8px">${S.data.water.filter(x => x.date === today()).map(x => `<li><div class="main"><span class="t">${x.ml}ml</span> <span class="s">今日</span></div>${delBtn('water', x.id)}</li>`).join('')}</ul>` : ''}
    </div>`;
  }
  // 睡眠
  if(S.denied.sleep) html += deniedCard('sleep');
  else {
    const sl = S.data.sleep;
    const recent = sl.filter(s => s.date >= daysAgo(6));
    const avg = recent.length ? Math.round(recent.reduce((a,s) => a + s.minutes, 0) / recent.length) : null;
    html += `<div class="card"><h2>睡眠${canEdit() ? `<span class="sub"><button class="btn sub sm" data-a="open" data-v="sleep">＋記録</button></span>` : ''}</h2>

  }
  return html;
}

function weightChart(list, goal){
  const pts = [...list].sort((a,b) => a.date < b.date ? -1 : 1).slice(-60);
  if(pts.length < 2) return '<p class="empty">2回以上記録するとグラフが出ます</p>';
  const W = 320, H = 170, L = 34, R = 10, T = 12, B = 22;
  const ys = pts.map(p => p.kg); if(goal != null) ys.push(goal);
  const mn = Math.floor(Math.min(...ys) - 0.5), mx = Math.ceil(Math.max(...ys) + 0.5);
  const t0 = Date.parse(pts[0].date), t1 = Date.parse(pts.at(-1).date);
  const x = p => L + (t1 === t0 ? 0.5 : (Date.parse(p.date) - t0) / (t1 - t0)) * (W - L - R);
  const y = v => T + (mx - v) / (mx - mn || 1) * (H - T - B);
  const line = pts.map((p,i) => `${i ? 'L' : 'M'}${x(p).toFixed(1)},${y(p.kg).toFixed(1)}`).join('');
  const area = `${line}L${x(pts.at(-1)).toFixed(1)},${H-B}L${x(pts[0]).toFixed(1)},${H-B}Z`;
  const ticks = [mn, (mn+mx)/2, mx];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f48fb1" stop-opacity=".35"/><stop offset="1" stop-color="#f48fb1" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#f6d6e1"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#a8899a">${(+v).toFixed(1)}</text>`).join('')}
    ${goal != null ? `<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#7cc7a8" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${y(goal)-4}" font-size="10" text-anchor="end" fill="#5aa886">目標 ${goal}kg</text>` : ''}
    <path d="${area}" fill="url(#wg)"/>
    <path d="${line}" fill="none" stroke="#e46f98" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${x(p)}" cy="${y(p.kg)}" r="3" fill="#fff" stroke="#e46f98" stroke-width="1.8"/>`).join('')}
    <text x="${L}" y="${H-6}" font-size="10" fill="#a8899a">${fmtDate(pts[0].date)}</text>
    <text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" fill="#a8899a">${fmtDate(pts.at(-1).date)}</text>
  </svg>`;
}

function viewSecret(){
  if(S.role !== 'member') return viewHome();
  if(S.privMeta === undefined) return `<div class="card"><p class="empty">読み込み中…</p></div>`;
  if(S.privMeta === null) return `<div class="card lockbox">${IC.lock}
    <h2 style="justify-content:center">ひみつの記録をはじめる</h2>
    <p class="muted" style="text-align:left">生理・体調メモ・体型写真は、<b>あなただけが知っている合言葉</b>で暗号化して保存します。オーナーを含め、ほかの誰にも中身は見えません。</p>
    <div class="note warn" style="text-align:left">合言葉を忘れると、記録は誰にも（あなた自身も）復元できません。忘れないものにしてね。</div>
    <form data-form="setup" style="text-align:left">
      <label class="f">合言葉（8文字以上）</label><input class="in" type="password" name="p1" minlength="8" required autocomplete="new-password">
      <label class="f">もう一度</label><input class="in" type="password" name="p2" minlength="8" required autocomplete="new-password">
      <button class="btn block" style="margin-top:14px">合言葉を設定する</button>
    </form></div>`;
  if(!S.key) return `<div class="card lockbox">${IC.lock}
    <h2 style="justify-content:center">ひみつの記録</h2>
    <form data-form="unlock" style="text-align:left">
      <label class="f">合言葉</label><input class="in" type="password" name="p" required autocomplete="current-password">
      <label class="row" style="margin-top:10px;font-size:13px"><input type="checkbox" name="remember" checked> この端末では次回から入力を省略する</label>
      <button class="btn block" style="margin-top:14px">ひらく</button>
    </form></div>`;

  const logs = S.priv.logs, photos = S.priv.photos;
  const starts = logs.filter(l => l.type === '生理開始').map(l => l.date).sort();
  let predict = '';
  if(starts.length){
    const gaps = []; for(let i=1;i<starts.length;i++){ const g = dayDiff(starts[i-1], starts[i]); if(g >= 15 && g <= 60) gaps.push(g); }
    const last = starts.at(-1);
    if(gaps.length){
      const avg = Math.round(gaps.slice(-6).reduce((a,b) => a+b, 0) / gaps.slice(-6).length);
      const d = new Date(Date.parse(last)); d.setUTCDate(d.getUTCDate() + avg);
      const next = `${d.getUTCFullYear()}-${z(d.getUTCMonth()+1)}-${z(d.getUTCDate())}`;
      predict = `<div class="muted">平均周期 ${avg}日 ・ 次回の目安 <b style="color:var(--pink-d)">${fmtDate(next)}</b>ごろ</div>`;
    }
    predict = `<div class="stat"><div class="label">前回の生理開始</div><div class="val" style="font-size:20px">${fmtDate(last)} <small>（${dayDiff(last, today())}日前）</small></div>${predict}</div>`;
  }
  return `<div class="card"><h2>${IC.lock.replace('<svg','<svg style="width:16px;stroke:#e46f98"')} 生理・体調<span class="sub"><button class="btn ghost sm" data-a="lock">ロック</button></span></h2>
      ${predict || '<p class="muted">「生理開始」を記録すると、次回の目安が出ます。</p>'}
      ${logs.length ? `<ul class="list" style="margin-top:8px">${logs.slice(0,40).map(l => `<li><div class="main"><div class="t">${esc(l.type)} <span class="s">${fmtDate(l.date)}</span></div>
        ${(l.conds||[]).map(c => `<span class="chip">${esc(c)}</span>`).join('')}${l.memo ? `<div class="s">${esc(l.memo)}</div>` : ''}</div>${delBtn('privateLogs', l.id)}</li>`).join('')}</ul>` : '<p class="empty">右下の＋から記録してね</p>'}
    </div>
    <div class="card"><h2>体型写真<span class="sub"><button class="btn sub sm" data-a="open" data-v="photo">＋追加</button></span></h2>
      ${photos.length ? `<div class="photos">${photos.map(ph => `<figure><img src="${ph.img}" alt="" data-a="zoom"><figcaption>${fmtDate(ph.date)}${ph.memo ? ' ' + esc(ph.memo) : ''}</figcaption>${delBtn('privatePhotos', ph.id)}</figure>`).join('')}</div>` : '<p class="empty">まだ写真がありません</p>'}

const closeSheet = () => { $sheet.innerHTML = ''; };
function autoSlot(){ const h = new Date().getHours(); return h < 10 ? '朝ごはん' : h < 15 ? '昼ごはん' : h < 21 ? '夜ごはん' : '間食'; }

async function addRec(col, data){ await addDoc(collection(db,col), { ...data, ts: serverTimestamp() }); }
async function addPriv(col, data){ await addDoc(collection(db,col), { ...(await encObj(data)), ts: serverTimestamp() }); }

async function handleForm(kind, f){
  const v = Object.fromEntries(new FormData(f));
  switch(kind){
    case 'meal': {
      const file = f.photo.files[0];
      const photo = file ? await compress(file, 800, 0.7, 250000) : null;
      await addRec('meals', { date:v.date, slot:v.slot, name:v.name.trim(), kcal:num(v.kcal), p:num(v.p), f:num(v.f), c:num(v.c), memo:v.memo.trim(), photo });
      break;
    }
    case 'gym': await addRec('gym', { date:v.date, exercise:v.exercise.trim(), kg:num(v.kg), reps:num(v.reps), sets:num(v.sets), memo:v.memo.trim() }); break;
    case 'weight': await addRec('weights', { date:v.date, kg:num(v.kg) }); break;
    case 'water': await addRec('water', { date:v.date, ml:num(v.ml) }); break;
    case 'sleep': {
      const [bh,bm] = v.bed.split(':').map(Number), [wh,wm] = v.wake.split(':').map(Number);
      const minutes = ((wh*60+wm) - (bh*60+bm) + 1440) % 1440;
      await addRec('sleep', { date:v.date, bed:v.bed, wake:v.wake, minutes });
      break;
    }
    case 'log': await addPriv('privateLogs', { date:v.date, type:v.type, conds:new FormData(f).getAll('conds'), memo:v.memo.trim() }); break;
    case 'photo': {
      const img = await compress(f.photo.files[0], 1100, 0.72, 600000);
      await addPriv('privatePhotos', { date:v.date, img, memo:v.memo.trim() });
      break;
    }
    case 'profile':
      await setDoc(doc(db,'profile','main'), { name:v.name.trim(), height:num(v.height), startWeight:num(v.startWeight), goalWeight:num(v.goalWeight), kcalGoal:num(v.kcalGoal), waterGoal:num(v.waterGoal) });
      break;
    case 'setup':
      if(v.p1 !== v.p2) throw new Error('合言葉が一致しません');
      await setupPass(v.p1); await idbSet('key_' + S.user.uid, S.key).catch(()=>{}); startPrivListeners();
      break;
    case 'cheer': {
      const text = v.text.trim();
      if(!text) throw new Error('メッセージを書いてね');
      await addDoc(collection(db,'cheers'), v.ticket ? { text, ticket:true, ts: serverTimestamp() } : { text, ts: serverTimestamp() });
      f.reset();
      break;
    }
    case 'gchar': {
      if(!CROP) throw new Error('画像をえらんでね');
      const img = makeSticker().toDataURL('image/jpeg', 0.88);
      await addDoc(collection(db,'gachaChars'), { name:v.name.trim(), rarity:['N','R','SR'].includes(v.rarity) ? v.rarity : 'N', img, ts: serverTimestamp() });
      CROP.count++;
      f.name.value = '';
      $sheet.querySelector('#cropcount').textContent = `${CROP.count}体 登録しました。続けて別のキャラを囲めます`;
      break;
    }
    case 'regmail': {
      const email = v.email.trim().toLowerCase();
      if(email === (S.user.email||'').toLowerCase()) throw new Error('自分のアドレスは登録できません');
      const b = writeBatch(db);
      if(S.invite) b.delete(doc(db,'invites',S.invite.id));
      b.set(doc(db,'config','app'), { memberUid:'', inviteToken:'', memberEmail: email });
      await b.commit();
      break;
    }
    case 'sendlink': {
      const email = v.email.trim().toLowerCase();
      const inv = localStorage.getItem('fitlife_invite');
      await sendSignInLinkToEmail(auth, email, { url: appUrl() + (inv ? '?invite=' + inv : ''), handleCodeInApp: true });
      localStorage.setItem('fitlife_email', email);
      LOGIN.sent = true; renderLogin();
      return;
    }
    case 'finishlink': await finishEmailLink(v.email, LOGIN.link); return;
    case 'pwlogin':
      await signInWithEmailAndPassword(auth, v.email.trim().toLowerCase(), v.pw);
      localStorage.setItem('fitlife_email', v.email.trim().toLowerCase());
      return;
    case 'setpw': {
      if(v.p1 !== v.p2) throw new Error('2つのパスワードがちがうみたい');
      const u = auth.currentUser;
      try{
        if((u.providerData||[]).some(p => p.providerId === 'password')) await updatePassword(u, v.p1);
        else await linkWithCredential(u, EmailAuthProvider.credential(u.email, v.p1));
      }catch(err){
        if(err.code === 'auth/requires-recent-login') throw new Error('安全のため、一度ログアウトして、もう一度ログインしてから設定してね');
        throw err;
      }
      break;
    }
    case 'pastelink': {
      const link = v.link.trim();
      if(!isSignInWithEmailLink(auth, link)) throw new Error('メールのリンクではないみたい。もう一度コピーしてね');
      const email = localStorage.getItem('fitlife_email');
      if(!email) throw new Error('先にメールアドレスを入れてリンクを送ってね');
      await finishEmailLink(email, link); return;
    }
    case 'unlock':
      if(!(await unlock(v.p, !!v.remember))) throw new Error('合言葉がちがいます');
      break;
  }
}

/* ===== イベント ===== */
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const btn = f.querySelector('button:not([type=button]):last-of-type'); if(btn){ btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = '保存中…'; }
  try{
    await handleForm(f.dataset.form, f);
    if(f.closest('.sheet') && f.dataset.form !== 'gchar') closeSheet();
    toast({ gchar:'キャラを登録しました 🎁', cheer:'送りました ♡', regmail:'登録しました', sendlink:'メールを送りました', finishlink:'ログインしました', pastelink:'ログインしました', pwlogin:'ログインしました', setpw:'パスワードを設定しました 🔑', setup:'合言葉を設定しました', unlock:'ひらきました', profile:'保存しました' }[f.dataset.form] || '記録しました ♡');
    render();
  }catch(err){
    console.error(err);
    toast(err.code === 'permission-denied' ? '権限がありません' : (err.code?.startsWith('auth/') ? authErr(err) : (err.message || '保存できませんでした')));
  }finally{ if(btn && btn.isConnected){ btn.disabled = false; btn.textContent = btn.dataset.t; } }
});

document.addEventListener('change', e => {
  const el = e.target.closest('input[data-crop]'); if(!el || !el.files[0]) return;
  openCrop(el.files[0]); el.value = '';
});

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if(a === 'close-bg' && e.target !== el) return;
  try{
    switch(a){
      case 'login': {
        const pv = new GoogleAuthProvider(); pv.setCustomParameters({ prompt:'select_account' });
        try{ await signInWithPopup(auth, pv); }
        catch(err){ if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(err.code)) await signInWithRedirect(auth, pv); else if(err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') toast('ログインできませんでした'); }
        break;
      }
      case 'logout': await signOut(auth); break;
      case 'resend': LOGIN.sent = false; renderLogin(); break;
      case 'pwreset': {
        const f = el.closest('form'), email = f.email.value.trim().toLowerCase();
        if(!email){ toast('先にメールアドレスを入れてね'); break; }
        await sendPasswordResetEmail(auth, email);
        localStorage.setItem('fitlife_email', email);
        f.querySelector('#pwnote').innerHTML = `<b>${esc(email)}</b> にメールを送りました。メールのリンクから新しいパスワードを決めたら、ここに戻って、そのパスワードでログインしてね。届かないときは迷惑メールも見てね。`;
        toast('パスワードを作るメールを送りました');
        break;
      }
      case 'tab': S.tab = v; window.scrollTo(0,0); render(); break;
      case 'open': openSheet(v); break;
      case 'close': case 'close-bg': closeSheet(); break;
      case 'water': await addRec('water', { date:today(), ml:Number(v) }); toast(`お水 ${v}ml ♡`); break;
      case 'del':
        if(!confirm('この記録を削除しますか？')) return;
        await deleteDoc(doc(db, el.dataset.col, el.dataset.id)); toast('削除しました'); break;
      case 'delcheer':
        if(!confirm('このメッセージを削除しますか？')) return;
        await deleteDoc(doc(db,'cheers',el.dataset.id)); toast('削除しました'); break;
      case 'lock': await lockNow(); toast('ロックしました'); break;
      case 'cropclose': if(CROP) URL.revokeObjectURL(CROP.url); CROP = null; closeSheet(); break;
      case 'claim': await claim(v); break;
      case 'gifts': await claimGifts(); break;
      case 'pull': await pullGacha(); break;
      case 'exchange': {
        const g = G(), missing = allChars().filter(c => !(g.coll[c.id] > 0));
        $sheet.innerHTML = `<div class="sheet-bg" data-a="close-bg"><div class="sheet"><h3>交換するキャラを選んでね<button class="del" data-a="close" aria-label="閉じる">×</button></h3>
          <div class="pickgrid">${missing.map(c => `<button data-a="pick" data-v="${c.id}">${charPic(c)}<div style="font-size:12px">${esc(c.name)}</div><span class="rar ${c.rarity}">${c.rarity}</span></button>`).join('')}</div></div></div>`;
        break;
      }
      case 'pick': {
        const g = G(), c = allChars().find(x => x.id === v);
        if(!c || g.shards < SHARD_NEED) break;
        g.shards -= SHARD_NEED; g.coll = { ...g.coll, [c.id]: 1 }; addHist(g, c, 'swap');
        await saveGame(g); showResult(c, false); break;
      }
      case 'delchar':
        if(!confirm('このキャラを削除しますか？（彼女のずかんからも消えます）')) return;
        await deleteDoc(doc(db,'gachaChars',el.dataset.id)); toast('削除しました'); break;
      case 'copy': await navigator.clipboard.writeText(v); toast('コピーしました'); break;
      case 'uninvite':
        if(!confirm('取り消しますか？（相手はログインできなくなります。記録は残ります）')) return;
        await setDoc(doc(db,'config','app'), { memberUid:'', inviteToken:'', memberEmail:'' }); toast('取り消しました'); break;
      case 'newinvite': {
        const t = [...crypto.getRandomValues(new Uint8Array(32))].map(x => x.toString(16).padStart(2,'0')).join('');
        const b = writeBatch(db);
        if(S.invite) b.delete(doc(db,'invites',S.invite.id));
        b.set(doc(db,'config','app'), { memberUid:'', inviteToken:'', memberEmail:'' });
        b.set(doc(db,'invites',t), { used:false, usedBy:'', expiresAt: Timestamp.fromMillis(Date.now() + 24*3600*1000), createdAt: serverTimestamp() });
        await b.commit(); toast('招待リンクを作りました'); break;
      }
      case 'zoom':
        $sheet.innerHTML = `<div class="sheet-bg" data-a="close-bg" style="align-items:center"><img src="${el.src}" style="max-width:94vw;max-height:86vh;border-radius:18px" data-a="close"></div>`; break;
    }
  }catch(err){ console.error(err); toast(err.code === 'permission-denied' ? '権限がありません' : (err.code?.startsWith('auth/') ? authErr(err) : 'うまくいきませんでした')); }
});
</script>
