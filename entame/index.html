<title>エンタメ管理</title>
<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="../shared/u-base.css">
<style>
/* 色・書体・角丸・土台・左メニューは u-base.css（アプリ共通）。ここはアクセント色と、このアプリだけの色 */
:root{--u-accent:#d4342a;--u-accent2:#fbe9e7;--anime:#d4342a;--drama:#2457d6;--movie:#7b4bd1;--stream:#0f8a8a;--reality:#d2457a;--yt:#e5221a;--sp:#d2457a;--su:#14896a;--au:#c8611a;--wi:#2f6fc9;--accent:#2f5bd6;--st-want:#1f8a52;--st-now:#c77a00;--st-done:#8a3b52;--st-drop:#7a8090}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--u-accent:#ff5a4e;--u-accent2:#3a1d1b;--anime:#ff6a5c;--drama:#6f97ff;--movie:#b18cff;--stream:#3fcfcf;--reality:#ff86b0;--yt:#ff4d45;--sp:#ff86b0;--su:#3fcf9f;--au:#ffa35c;--wi:#7fb0ff;--accent:#8fa8ff;--st-want:#4cc98a;--st-now:#f0a83a;--st-done:#e08aa3;--st-drop:#8e95a8}
}
:root[data-theme="dark"]{--u-accent:#ff5a4e;--u-accent2:#3a1d1b;--anime:#ff6a5c;--drama:#6f97ff;--movie:#b18cff;--stream:#3fcfcf;--reality:#ff86b0;--yt:#ff4d45;--sp:#ff86b0;--su:#3fcf9f;--au:#ffa35c;--wi:#7fb0ff;--accent:#8fa8ff;--st-want:#4cc98a;--st-now:#f0a83a;--st-done:#e08aa3;--st-drop:#8e95a8}
/* Layout: 番組表（TV guide）— sticky channel bar, weekday rows of program slots, bottom sheet detail */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark}
}
:root[data-theme="dark"]{color-scheme:dark}
body{background:var(--u-bg);color:var(--u-ink);font-size:15px;line-height:1.55;margin:0;font-family:var(--u-f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--u-surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--u-surface);border-bottom:1px solid var(--u-line)}
.logo{font-family:var(--u-f);display:flex;align-items:center;gap:8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;font-size:18px;font-weight:900;letter-spacing:.02em}
.lamp{font-family:var(--u-num);font-size:10px;letter-spacing:.12em;font-weight:600;padding:4px 6px 3px;border-radius:4px;line-height:1;background:var(--u-accent);color:var(--u-on)}
.add{border:0;font-size:13px;flex:none;background:var(--u-accent);color:var(--u-on);border-radius:var(--u-r);padding:8px 14px;font-weight:700}
[hidden]{display:none!important}
.banner{margin-top:12px;background:var(--u-surface);border:1px solid var(--u-line);border-left:4px solid var(--u-accent);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{display:block}
.banner button{border:1px solid var(--u-line);background:var(--u-bg);border-radius:8px;padding:6px 10px;font-size:13px}
main{padding-bottom:48px}
.day{margin-top:18px}
.dayhd{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.dayhd h2{font-family:var(--u-f);font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.dayhd small{color:var(--u-sub);font-size:12px}
.today-tag{font-family:var(--u-num);font-size:10px;color:#fff;background:var(--u-accent);border-radius:3px;padding:1px 6px;letter-spacing:.08em}
.slots{background:var(--u-surface);border:1px solid var(--u-line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:stretch;border-top:1px solid var(--u-line)}
.row:first-child{border-top:0}
.slot{display:grid;flex:1;min-width:0;border:0;background:transparent;text-align:left;-webkit-tap-highlight-color:transparent;grid-template-columns:52px 1fr auto;gap:10px;padding:8px 10px;align-items:start}
@media (hover:hover){
  .slot:hover{background:var(--u-chip)}
  .edl dd[data-jump]:hover,.edl dd[data-inl]:hover{background:var(--u-chip)}
  .edl dd:hover .pen{opacity:1}
  .vgear:hover{background:var(--u-chip);color:var(--u-ink)}
}
.slot:active{background:var(--u-chip)}
.time{font-family:var(--u-num);font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px;display:grid;gap:3px;justify-items:start;padding-top:1px}
.time small{display:block;color:var(--u-sub);font-weight:500;letter-spacing:.04em;font-size:9.5px;line-height:1}
.ttl{min-width:0}
.ttl strong{font-weight:700;overflow-wrap:anywhere;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:.01em}
.meta{font-size:12px;color:var(--u-sub);display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kind{font-size:10px;font-weight:700;border-radius:3px;padding:1px 5px;line-height:1.4;color:#fff;background:var(--u-sub);white-space:nowrap}
.kind.a{background:var(--anime)}
.kind.d{background:var(--drama)}
.next{font-size:12px;margin-top:3px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.backlog{font-weight:700;color:var(--u-accent)}
.pill{font-weight:700;border-radius:999px;white-space:nowrap;color:#fff;font-size:10.5px;padding:2px 8px;align-self:center}
.s-未視聴{background:var(--st-want)}
.s-視聴中{background:var(--st-now)}
.s-視聴済み{background:var(--st-done)}
.s-見ない{background:var(--st-drop)}
.tick{flex:none;border:0;border-left:1px solid var(--u-line);background:transparent;display:grid;place-items:center;gap:0;color:var(--u-sub);padding:6px 0;width:52px;font-size:9.5px}
.tick span{display:grid;place-items:center;border-radius:50%;border:2px solid var(--u-accent);color:var(--u-accent);font-size:15px;font-weight:700;width:26px;height:26px}
.tick:not(:disabled):hover span{background:var(--u-accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.chips button{border:1px solid var(--u-line);background:var(--u-surface);border-radius:999px;padding:4px 11px;font-size:12.5px}
.chips button[aria-pressed="true"]{border-color:var(--u-ink);background:var(--u-ink);color:var(--u-surface)}
.count{font-size:12px;color:var(--u-sub);margin:12px 0 6px}
.empty{padding:28px 16px;text-align:center;color:var(--u-sub);font-size:14px}
.more{display:block;width:100%;margin-top:10px;border:1px solid var(--u-line);background:var(--u-surface);padding:10px;font-weight:700;border-radius:var(--u-r)}
.scrim{position:fixed;inset:0;z-index:20;touch-action:none;background:var(--u-scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--u-surface);border-radius:16px 16px 0 0;max-height:90vh;overflow:hidden auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);overscroll-behavior:none;-webkit-overflow-scrolling:touch}
@media (min-width:700px){
  .sheet{left:50%;right:auto;width:620px;transform:translateX(-50%)}
  .fgrid .full{grid-column:1/-1}
}
.sheet .wrap{padding-top:10px}
.sheet h3{font-family:var(--u-f);font-weight:700;font-size:20px;line-height:1.4;margin:4px 0 6px;text-wrap:balance}
.sheet h4{font-size:13px;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sheet h4 small{color:var(--u-sub);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin:14px 0}
.seg button{border:1px solid var(--u-line);background:transparent;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg button.s-未視聴{background:var(--st-want)}
.seg button.s-視聴中{background:var(--st-now)}
.seg button.s-視聴済み{background:var(--st-done)}
.seg button.s-見ない{background:var(--st-drop)}
dl{display:grid;grid-template-columns:92px 1fr;gap:8px 12px;margin:0;font-size:14px}
dt{color:var(--u-sub);font-size:12px;padding-top:2px}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.eps{border:1px solid var(--u-line);border-radius:10px;overflow:hidden}
.ep{display:grid;grid-template-columns:28px 52px 1fr auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--u-line);background:transparent;text-align:left;padding:9px 12px;font-size:13.5px}
.ep:first-child{border-top:0}
.ep .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--u-line);display:grid;place-items:center;font-size:13px;color:#fff;transition:background .15s}
.ep[aria-checked="true"] .box{background:var(--u-ok);border-color:var(--u-ok)}
.ep[aria-checked="true"] .epn,.ep[aria-checked="true"] .eps-sub{color:var(--u-sub)}
.ep .epn{font-family:var(--u-num);font-weight:600;font-variant-numeric:tabular-nums}
.ep .eps-sub{min-width:0;overflow-wrap:anywhere}
.ep .epd{font-family:var(--u-num);font-size:11.5px;color:var(--u-sub);text-align:right;white-space:nowrap}
.ep.future .epd{color:var(--accent)}
.prog{height:6px;border-radius:3px;background:var(--u-chip);overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--u-ok)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.links a{border:1px solid var(--u-line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--u-ink);text-decoration:none}
.close{float:right;border:0;background:var(--u-chip);border-radius:999px;width:32px;height:32px;font-size:16px}
.note{font-size:12px;color:var(--u-sub);margin:22px 0 0}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}}
  @media (min-width:700px){
    .sheet{animation:none}
  }
}
.epset{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.epset label{display:grid;gap:3px;font-size:11.5px;color:var(--u-sub)}
.epset input{width:84px;border:1px solid var(--u-line);background:var(--u-bg);color:var(--u-ink);border-radius:8px;padding:7px 8px;font:inherit;font-size:14px}
.epset button{border:1px solid var(--u-line);background:var(--u-bg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700}
.loading{padding:60px 16px;text-align:center;color:var(--u-sub)}
/* clock */
.clock{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 4px}
.clock .now{display:flex;align-items:baseline;gap:12px}
.clock time{font-family:var(--u-num);font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock .date{font-size:14px;font-weight:700;color:var(--u-sub)}
.clock .soon{font-size:12.5px;color:var(--u-sub);text-align:right;min-width:0}
.clock .soon b{color:var(--u-ink);font-weight:700}
.clock .soon .lbl{font-family:var(--u-num);font-size:10px;letter-spacing:.1em;color:var(--u-accent);margin-right:6px}
/* library filter */
.ftools{display:flex;gap:8px;padding-block:14px 0}
.ftools input{flex:1;min-width:0;border:1px solid var(--u-line);background:var(--u-surface);color:var(--u-ink);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12.5px}
.active .tag{border:0;background:var(--u-chip);border-radius:999px;padding:4px 10px;font-size:12.5px}
.active .tag::after{content:" ✕";color:var(--u-sub)}
.active .clear{border:0;background:transparent;color:var(--accent);font-size:12.5px;font-weight:700;padding:4px 6px}
.fgroup{margin-top:16px}
.fgroup h5{font-size:12px;color:var(--u-sub);margin:0 0 8px;font-weight:700;letter-spacing:.04em}
.fgroup .chips{padding-top:0}
.fgroup .chips button{padding:6px 12px;font-size:13px}
.chips button small{font-family:var(--u-num);font-size:10.5px;opacity:.7;margin-left:3px}
.ffoot{position:sticky;bottom:0;background:var(--u-surface);display:flex;gap:10px;padding-block:10px calc(4px + env(safe-area-inset-bottom,0px));margin-top:12px;border-top:1px solid var(--u-line)}
.ffoot .primary{flex:1}
/* ボタンの大きさ・形は共通部品（u-btn）。枠線だけのボタンは、下の色を透かす */
.ghost{background:transparent;color:inherit}
/* add form: phone = full-height sheet, PC = centered dialog with two columns */
.sheet,.sheet.form{top:50%;bottom:auto;left:50%;right:auto;width:calc(100% - 24px);max-width:720px;transform:translate(-50%,-50%);max-height:calc(100% - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-bottom:0;animation:none;border-radius:16px;box-shadow:var(--u-shadow)}
.sheet:not(.form){max-width:640px}
.fgrid{display:grid;gap:10px;margin-top:6px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:700;color:var(--u-sub)}
.field input,.field select{width:100%;border:1px solid var(--u-line);background:var(--u-bg);color:var(--u-ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px}
.segc{display:flex;gap:6px;flex-wrap:wrap}
.segc button{flex:1 1 0;min-width:44px;border:1px solid var(--u-line);background:transparent;border-radius:10px;padding:7px 6px;font-weight:700;font-size:13.5px}
.segc button[aria-pressed="true"]{background:var(--u-ink);border-color:var(--u-ink);color:var(--u-surface)}
.segc button.ka[aria-pressed="true"]{background:var(--anime);border-color:var(--anime);color:#fff}
.segc button.kd[aria-pressed="true"]{background:var(--drama);border-color:var(--drama);color:#fff}
.hint{font-size:11.5px;color:var(--u-sub)}
@media (min-width:700px){
  .fgrid{grid-template-columns:1fr 1fr;gap:12px 16px}
  .ffoot{justify-content:flex-end;padding-block:10px 12px}
  .ffoot .primary{flex:0 0 auto;padding-inline:28px}
}
/* compact program slots */
.time .kind{font-size:9.5px;padding:1px 4px}
.lab{font-size:10.5px;line-height:1.5;padding:0 6px;border-radius:4px;border:1px solid var(--u-line);color:var(--u-sub);white-space:nowrap}
.lab.v{border-color:transparent;background:var(--u-chip);color:var(--u-ink)}
.next{font-size:11.5px;margin-top:4px}
.tick span{font-size:13px}
.sheet .meta{margin:0 0 4px}
.hdrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.editbtn{border:1px solid var(--u-line);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700}
.sheet .close{float:none}
.labs{display:flex;flex-wrap:wrap;gap:4px}
.lab.s{border-color:var(--accent);color:var(--accent);font-weight:700}
button.lab.s{font:inherit;font-size:12px;font-weight:700;padding:2px 8px;background:transparent;white-space:normal;text-align:left;max-width:100%}
.lab.c{border-color:transparent;display:inline-flex;align-items:baseline;gap:3px;font-family:var(--u-f);font-weight:700;font-size:10.5px;padding:0 6px;border-radius:4px;background:color-mix(in srgb,var(--u-sub) 12%,transparent);color:var(--u-sub)}
/* watched: clearly marked */
.ep.seen{background:color-mix(in srgb,var(--u-ok) 11%,transparent)}
.ep.seen .epn{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--u-ok) 70%,transparent)}
.row.done{background:color-mix(in srgb,var(--st-done) 7%,transparent);box-shadow:inset 4px 0 0 var(--st-done)}
.row.done .ttl strong{color:var(--u-sub)}
/* songs */
.songs{display:grid;gap:3px}
.rng{font-family:var(--u-num);font-size:11px;color:var(--u-sub);background:var(--u-chip);border-radius:4px;padding:0 6px;margin-left:6px;white-space:nowrap}
.sglist{display:grid;gap:8px}
.sg{border:1px solid var(--u-line);border-radius:var(--u-rl);background:var(--u-bg);padding:10px;display:grid;gap:8px}
.sg-top{display:flex;align-items:center;gap:10px}
.sg-top select{width:auto;min-width:110px;padding:6px 8px;font-size:14px;font-weight:700}
.sg-top .sg-dlw{margin-left:auto}
.sg .del{border:0;background:transparent;color:var(--u-danger);font-size:12.5px;font-weight:700;padding:6px 4px}
.sg-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg-f label{display:grid;gap:4px;min-width:0}
.sg-f label span,.sg-rl{font-size:11.5px;font-weight:700;color:var(--u-sub)}
.sg-f input,.sg-r input{padding:7px 9px;font-size:14.5px;width:100%}
.sg-r{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--u-sub);white-space:nowrap}
.sg-r .sg-rl{margin-right:4px}
.sg-r input{width:72px}
@media (max-width:560px){
  .sg-f{grid-template-columns:1fr}
}
.sheet.form.mini{max-width:600px}
.stt{font-weight:700}
.sar{color:var(--u-sub);margin-left:2px}
.sernew{display:flex;gap:8px;margin-top:8px}
.sernew input{flex:1;min-width:0}
.sernew button{flex:none;border:1px solid var(--u-line);background:var(--u-bg);border-radius:10px;padding:0 14px;font-weight:700;font-size:14px}
.field .chips button[aria-pressed="true"]{background:var(--u-ink);border-color:var(--u-ink);color:var(--u-surface)}
.field .chips{padding-top:0}
.field .chips button{padding:5px 10px;font-size:13px}
/* 小さいボタン */
/* library cour groups */
.cgroup{margin-top:18px}
.ghd{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;font-family:var(--u-f);font-weight:700;font-size:16.5px;letter-spacing:.02em;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdh,124px));z-index:2;background:var(--u-bg);padding-block:6px}
.ghd small{font-family:var(--u-f);font-size:11.5px;color:var(--u-sub);font-weight:500}
.ghd span{margin-left:auto;font-family:var(--u-f);font-size:12px;color:var(--u-sub)}
/* edit form sections */
.fsec{border:1px solid var(--u-line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--u-surface)}
.fsec h4{margin:0 0 8px;font-size:13px;letter-spacing:.04em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fsec h4 .hint{font-weight:400}
.fsec .fgrid{margin-top:0;gap:10px}
.sched{background:var(--u-bg);border-radius:10px;padding:7px 10px;font-size:13.5px}
.sched b{font-weight:700}
.serpick{display:flex;align-items:center;gap:10px;min-width:0}
.serpick .ghost{flex:none;white-space:nowrap}
.serpick .lab.s{font-size:14px;padding:4px 10px;white-space:normal;min-width:0}

async function moveInRun(text, say) {

  if (!j || j.app !== "entame" || !j.data || typeof j.data !== "object") {
    say("データを読み取れませんでした。書き出したものをそのまま貼り付けてください（途中で切れていないか確かめてください）。", true);
    return false;
  }
  const jobs = [],
    skip = [];
  ["titles", "progress", "yt", "master", "meta"].forEach(col =>
    Object.entries(j.data[col] || {}).forEach(([id, d]) => {
      if (!id || id.includes("/") || !d || typeof d !== "object" || Array.isArray(d) || nestedArr(d, false)) skip.push(`${col}/${id}`);

  );

  if (s.kind !== "fb" || !s.db.setMany) {

let openId = null,

/* 貼り付けた各話リストから「話数 → サブタイトル」を読み取る */
const KN = { 〇: 0, 零: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
function kanjiNum(t) {
  if (/^\d+$/.test(t)) return +t;

  for (const c of t) {

const EP_RE =
  /^\s*(?:第\s*([0-9０-９〇零一二三四五六七八九十百]+)\s*[話回]|#\s*([0-9０-９]+)|([0-9０-９]+)\s*[話回]|([0-9０-９]+)(?=\t))\s*[\t:：.．\s]*(.*)$/;

function parseSubtitles(text) {
  const lines = String(text || "")
    .replace(/\r/g, "")

  for (const raw of lines) {
    const line = raw.replace(/ /g, " ");

    if (m) {
      const n = kanjiNum(zen(m[1] || m[2] || m[3] || m[4]));

      last = e;

      continue;
    }
    let rest2 = line;
    if (open) {
      const ps = line.split("\t");
      const first = ps[0].trim();
      if (first && !/^(\d{4}年|\d{1,2}月\d{1,2}日|第\d+シーズン|第[一二三四五六七八九十]+期)/.test(first)) {

  let year = null,
    prevM = 0;
  out.forEach(e => {
    const t = zen(e.blk || "");
    const re = /(?:(\d{4})\s*[年\/\-.]\s*)?(\d{1,2})\s*[月\/\-.]\s*(\d{1,2})\s*日?/g;

    if (!hit) {

    let y = hit[1] ? +hit[1] : year;

  const seen = new Set();

}

  box.classList.add("sorting");

  else if (e.clientY > r.bottom - 24) box.scrollTop += 8;
  const rows = [...box.querySelectorAll(".mrow2")].filter(x => x !== row);
  const next = rows.find(x => {
    const b = x.getBoundingClientRect();

      ytOver[id] = { ...(ytOver[id] || {}), ...p };

    return ids.length;

const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function parseDay(t) {
  t = String(t || "")
    .normalize("NFKC")
    .trim();
  if (!t) return "";
  let m;
  if ((m = /(\d{4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/.exec(t)));
  else if ((m = /([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/.exec(t))) m = [0, m[3], MON[m[1].toLowerCase()], m[2]];
  else if ((m = /(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?\s+(\d{4})/.exec(t))) m = [0, m[3], MON[m[2].toLowerCase()], m[1]];
  else if ((m = /^(\d{4})(\d{2})(\d{2})$/.exec(t)));
  else return null;
  const y = +m[1],
    mo = +m[2],
    d = +m[3];
  if (!y || !mo || mo > 12 || !d || d > 31) return null;
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
/* 再生時間：「630」→6時間30分、「45」→45分、「6:30」→6時間30分。すでに「〜時間〜分」ならそのまま */
function parseDur(t) {
  t = String(t || "")
    .normalize("NFKC")
    .trim();
  if (!t) return "";
  if (/時間|分/.test(t)) return t;
  let h = 0,
    mi = 0,
    m;
  if ((m = /^(\d+):(\d{1,2})(?::\d{1,2})?$/.exec(t))) {
    h = +m[1];
    mi = +m[2];
  } else if (/^\d+$/.test(t)) {
    if (t.length <= 2) mi = +t;
    else {
      h = +t.slice(0, -2);
      mi = +t.slice(-2);
    }
  } else return t;
  if (mi >= 60) {
    h += Math.floor(mi / 60);
    mi %= 60;
  }
  return (h ? `${h}時間` : "") + (mi || !h ? `${mi}分` : "");
}

function ytReadForm() {

async function ytSubmit() {
  {
    const ui = $("#y-up");
    if (ui && ui.value.trim() && parseDay(ui.value) === null) {
      ui.focus();
      toast("初回投稿日を読み取れませんでした（例：2024/03/08）");
      return;
    }
  }
  ytReadForm();
  const f = yform;
  const t = f.t.trim();
  if (!t) {
    $("#y-t").focus();
    toast("動画タイトルを入れてください");

  const patch = {
    t,
    a: f.a.trim(),
    g: f.g,
    ...(f.sg !== undefined ? { sg: f.sg } : {}),
    s: f.s,
    up: f.up,
    n: Math.max(0, +f.n || 0),
    dur: f.dur.trim(),
    pl: f.pl.trim(),
    sm: String(f.sm || "").trim(),
  };
  const id = f.id || "y" + Date.now().toString(36);

/* events (returns true when handled) */
function ytClick(e) {
  {
    const t = e.target;
    const ft = t.closest("[data-ftog],[data-ytpop]");
    if (ft) {
      const v = ft.dataset.ftog || ft.dataset.ytpop;
      yst.fp = yst.fp === v ? "" : v;
      saveYtUI();
      render();
      return true;
    }
    const yg = t.closest("[data-ytgrp]");
    if (yg) {
      yst.grp = yg.dataset.ytgrp;
      yst.fp = "";
      saveYtUI();
      render();
      return true;
    }
    const ys = t.closest("[data-ytsort]");
    if (ys) {
      yst.sort = ys.dataset.ytsort;
      yst.fp = "";
      saveYtUI();
      render();
      return true;
    }
    if (t.closest("[data-ytreset]")) {
      Object.assign(yst, { pri: [], genre: "すべて", sub: "すべて" });
      saveYtUI();
      render();
      return true;
    }
  }
  const t = e.target;
  const g = t.closest("[data-ytg]");
  if (g) {
    yst.genre = g.dataset.ytg;
    yst.sub = "すべて";
    saveYtUI();
    render();
    return true;
  }
  const sb = t.closest("[data-ytsub]");
  if (sb) {
    yst.sub = sb.dataset.ytsub;
    saveYtUI();
    render();
    return true;
  }
  const pr = t.closest("[data-ytpri]");
  if (pr) {
    const v = pr.dataset.ytpri;
    yst.pri = v === "すべて" ? [] : toggle(yst.pri, v);
    saveYtUI();
    render();
    return true;
  }
  const r = t.closest("[data-yt]");
  if (r) {
    ytOpenDetail(r.dataset.yt);
    return true;
  }
  if (yform) {
    const fa = t.closest("[data-yfa]");
    if (fa) {
      ytReadForm();
      yform.a = fa.dataset.yfa;
      const i = $("#y-anew");
      if (i) i.value = "";
      ytRedrawForm();
      return true;
    }
    const fg = t.closest("[data-yfg]");
    if (fg) {
      ytReadForm();
      const v = fg.dataset.yfg;
      yform.g = ytCat(yform) === v ? "" : v === SOLO ? SOLO : ytSub(yform) || COLLAB;
      ytRedrawForm();
      return true;
    }
    const fsg = t.closest("[data-yfsg]");
    if (fsg) {
      ytReadForm();
      yform.sg = ytSolo(yform) === fsg.dataset.yfsg ? "" : fsg.dataset.yfsg;
      ytRedrawForm();
      return true;
    }
    const fsb = t.closest("[data-yfsub]");
    if (fsb) {
      ytReadForm();
      yform.g = ytSub(yform) === fsb.dataset.yfsub ? COLLAB : fsb.dataset.yfsub;
      ytRedrawForm();
      return true;
    }
    const fs = t.closest("[data-yfs]");
    if (fs) {
      ytReadForm();
      yform.s = yform.s === fs.dataset.yfs ? "" : fs.dataset.yfs;
      ytRedrawForm();
      return true;
    }
  }
  const x = ytOpen && ytItems.find(y => y.id === ytOpen);
  if (x) {
    if (t.closest("#ytEdit")) {
      ytOpenForm(x);
      return true;
    }
    {
      const inl = t.closest("[data-inl]");
      if (inl) {
        if (!t.closest("input")) startInline(inl);
        return true;
      }
      const jp = t.closest("[data-jump]");
      if (jp) {
        ytOpenForm(x, jp.dataset.jump);
        return true;
      }
    }
    const s = t.closest("[data-yts]");
    if (s) {
      const v = s.dataset.yts;
      if ((x.s || "") !== v) ytSave(x.id, { s: v }, v ? `「${v}」にしました` : "未視聴にしました");
      return true;
    }
    const p = t.closest("[data-ytp]");
    if (p) {
      const n = +x.n || 0;
      let pw = +x.pw || 0;
      const v = p.dataset.ytp;
      pw = v === "all" ? n : v === "reset" ? 0 : Math.max(0, Math.min(n, pw + +v));
      const patch = { pw };
      let msg = `${pw}本目まで見ました`;
      if (n && pw >= n && x.s !== "視聴済み") {
        patch.s = "視聴済み";
        msg = "最後まで見たので「視聴済み」にしました";
      } else if (pw > 0 && pw < n && !x.s) {
        patch.s = "視聴中";
        msg = `${pw}本目まで見ました（視聴中にしました）`;
      }
      ytSave(x.id, patch, msg);
      return true;
    }
    if (t.closest("#ytDel")) {
      const b = t.closest("#ytDel");
      if (b.dataset.c) {
        const id = x.id,
          t0 = x.t,
          prev = { ...(ytOver[id] || {}) };
        delete ytOver[id];
        ytRebuild();
        close();
        render();
        removeDoc("yt", id).catch(fail);
        toastUndo(`「${t0.slice(0, 18)}」を削除しました`, () => {
          ytOver[id] = prev;
          ytRebuild();
          render();
          saveDoc("yt", id, prev).catch(fail);
        });
      } else {
        b.dataset.c = "1";
        b.textContent = "もう一度押すと削除";
        b.classList.add("armed");
      }
      return true;
    }
  }
  return false;
}

        i.select();
      }

        setKey,
        M(setKey).filter(x => x !== n),
      );

      return true;
    }

      const v = ($("#maddIn")?.value || "").trim();
      if (!v) {

        return true;
      }

      if (l.includes(v)) {

/* 画面の切り替え（番組表／ライブラリ・投稿者・アニメ／ドラマ／YouTube）と見出しの開閉 */
function setMode(m) {
  if (state.mode === m) return;
  state.mode = m;
  if (m === "m" || m === "s") {
    state.kind = m === "m" ? state.mk : "all";
    state.type = [];
    state.limit = 200;
    state.series = [];
  } else if (m !== "yt") {
    state.kind = m;
    state.limit = 200;
    state.series = [];
  }
}
function onNavClick(e) {
  const tb = e.target.closest("[data-tb]");
  if (tb) {
    const v = tb.dataset.tb;
    if (tb.dataset.go) setMode(tb.dataset.go);
    if (state.mode === "yt") {
      yst.author = v;
      saveYtUI();
    } else if (state.mode === "m") {
      state.mk = state.kind = v;
      state.limit = 200;
    } else state.view = v;
    render();
    scrollTo(0, 0);
    return true;
  }
  const vb = e.target.closest("[data-vod]");
  if (vb) {
    state.vod = vb.dataset.vod === "" ? "" : state.vod === vb.dataset.vod ? "" : vb.dataset.vod;
    state.limit = 200;
    state.fOpen = "";
    render();
    return true;
  }
  const md = e.target.closest("[data-mode]");
  if (md) {
    const m = md.dataset.mode;
    if (state.mode !== m) {
      setMode(m);
      render();
      scrollTo(0, 0);
    }
    return true;
  }
  const gt = e.target.closest("[data-gtog]");
  if (gt) {
    const k = gt.dataset.gtog;
    collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k);

  const ga = e.target.closest("[data-gall]");
  if (ga) {

    ks.forEach(k => (ga.dataset.gall === "close" ? collapsed.add(k) : collapsed.delete(k)));

    render();
    return true;
  }

}

function onFilterClick(e) {

  }
  const ftg = e.target.closest("[data-ftog]");

    state.fOpen = state.fOpen === v ? "" : v;

    return true;

  const er = e.target.closest("[data-era]");
  if (er) {
    state.era = er.dataset.era === "すべて" ? [] : toggle(state.era, er.dataset.era);
    state.limit = 200;

    return true;

    state.limit = 200;

    return true;
  }
  const sa = e.target.closest("[data-seradd]");
  if (sa) {
    state.series = [...state.series, sa.dataset.seradd];
    if (state.sort === "new") state.sort = "old";
    state.limit = 200;
    render();
    const q = $("#seriesQ");
    if (q) q.focus();
    return true;
  }
  const sd = e.target.closest("[data-serdel]");
  if (sd) {
    state.series = state.series.filter(x => x !== sd.dataset.serdel);
    state.limit = 200;
    render();
    return true;
  }
  const co = e.target.closest("[data-cour]");
  if (co) {
    state.cour = co.dataset.cour === "すべて" ? [] : toggle(state.cour, co.dataset.cour);
    state.limit = 200;
    render();
    return true;
  }
  const se = e.target.closest("[data-series]");
  if (se) {
    state.series = [se.dataset.series];
    state.view = "list";
    Object.assign(state, { sf: [], era: [], cour: [], type: [], sort: "old", limit: 200 });
    close();
    render();
    scrollTo(0, 0);
    return true;
  }
  const so = e.target.closest("[data-sort]");
  if (so) {
    state.sort = so.dataset.sort;
    state.fOpen = "";
    saveUI();
    render();
    return true;
  }
  const un = e.target.closest("[data-unset]");
  if (un) {
    const u = un.dataset.unset;
    const [g, v] = u.split(/:(.*)/s);
    if (u === "all" || u === "filters") {
      Object.assign(state, { sf: [], era: [], cour: [], series: [], type: [] });
      if (u === "all") state.vod = "";
    } else if (v !== undefined && Array.isArray(state[g])) state[g] = state[g].filter(x => x !== v);
    else if (g === "sort") state.sort = "new";
    else if (g === "type") state.type = [];
    else if (Array.isArray(state[g])) state[g] = [];
    state.limit = 200;
    render();
    return true;
  }
  return false;
}

function onDetailClick(e) {
  const it = openId && items.find(x => x.id === openId);
  if (it) {
    if (e.target.closest("#editItem")) {
      openForm(it);
      return true;
    }
    const nsb = e.target.closest("[data-nosong]");
    if (nsb) {
      const k = nsb.dataset.nosong;
      const cur = it.noSongs || [];
      saveTitle(
        it.id,
        { noSongs: cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k] },
        `${k}を「なし」にしました`,
      );
      return true;
    }
    const sdb = e.target.closest("[data-sgdl]");
    if (sdb) {
      const k = +sdb.dataset.sgdl;
      const l = songsOf(it).map(x => ({ ...x }));
      if (l[k]) {
        l[k].dl = l[k].dl ? 0 : 1;
        saveTitle(it.id, { songs: l }, l[k].dl ? "ダウンロード済みにしました" : "未ダウンロードに戻しました");
      }
      return true;
    }
    {
      const inl = e.target.closest("[data-inl]");
      if (inl) {
        if (!e.target.closest("input")) startInline(inl);
        return true;
      }
      const jp = e.target.closest("[data-jump]");
      if (jp && !e.target.closest("a,button:not([data-jump])")) {
        openForm(it, jp.dataset.jump);
        return true;
      }
    }
    const st = e.target.closest("[data-set]");
    if (st) {
      setStatus(it, st.dataset.set);
      return true;
    }
    const ep = e.target.closest("[data-ep]");
    if (ep) {
      const i = +ep.dataset.ep;
      const l = episodes(it);
      toggleEp(it, i, !l[i].w);
      return true;
    }
    if (e.target.closest("#allAired")) {
      const l = episodes(it);
      l.forEach(x => {
        if (aired(x)) x.w = true;
      });
      saveEps(it, l, "放送済みの話を全部チェックしました");
      return true;
    }
    if (e.target.closest("#clearAll")) {
      const l = episodes(it);
      l.forEach(x => (x.w = false));
      saveEps(it, l, "チェックを全部外しました");
      return true;
    }
    if (e.target.closest("#spOpen")) {
      subPaste = { text: "" };
      refreshSheet();
      if (!TOUCH) $("#spText")?.focus({ preventScroll: true });
      return true;
    }
    if (subPaste) {
      if (e.target.closest("#spCancel")) {
        subPaste = null;
        refreshSheet();
        return true;
      }
      if (e.target.closest("#spBack")) {
        subPaste = { text: subPaste.text };
        refreshSheet();
        return true;
      }
      if (e.target.closest("#spRead")) {
        const text = $("#spText").value;
        const parsed = parseSubtitles(text);
        if (!parsed.length) {
          subPaste = { text };
          refreshSheet();
          toast("話数とサブタイトルを読み取れませんでした。「第1話」「1話」などで始まる行が必要です");
          return true;
        }
        const eps = episodes(it);
        const fy = yearOf(it) || new Date().getFullYear();
        subPaste = {
          text,
          addMissing: false,
          useDate: false,
          rows: parsed.map(r => {
            const idx = eps.findIndex(x => epNum(x.n) === r.n);
            const cur = idx >= 0 ? eps[idx] : null;
            let date = r.date;
            if (!date && r.md) {
              const y = cur && cur.t ? jst(cur.t).y : fy;
              date = `${y}-${String(r.md[0]).padStart(2, "0")}-${String(r.md[1]).padStart(2, "0")}`;
            }
            const oldDay = cur && cur.t ? jst(cur.t).day : "";
            return {
              ...r,
              date,
              idx,
              old: cur ? cur.sub || "" : "",
              oldDay,
              dateCh: !!(date && cur && date !== oldDay),
            };
          }),
        };
        refreshSheet();
        return true;
      }
      if (e.target.closest("#spApply")) {
        const l = episodes(it);
        let n = 0,
          dn = 0;
        const p = subPaste;
        const at = (day, old) => {
          const hm = old && old.t ? jst(old.t).hm : hasTime(it) ? it.time : "9:00";
          return dayTimeToT(day, hm);
        };
        p.rows.forEach(r => {
          if (r.idx < 0) return;
          const x = l[r.idx];
          if (x.sub !== r.sub) {
            x.sub = r.sub;
            n++;
          }
          if (p.useDate && r.dateCh) {
            x.t = at(r.date, x);
            if (!x.t || !hasTime(it)) x.nt = x.nt || !hasTime(it);
            dn++;
          }
        });
        if (p.addMissing) {
          p.rows
            .filter(r => r.idx < 0)
            .sort((a, b) => a.n - b.n)
            .forEach(r => {
              const x = nextEp(it, l);
              x.n = `${r.n}話`;
              x.sub = r.sub;
              if (r.date) {
                x.t = at(r.date, null);
                x.nt = !hasTime(it);
              }
              l.push(x);
              n++;
            });
          l.sort((a, b) => (epNum(a.n) ?? 0) - (epNum(b.n) ?? 0));
        }
        subPaste = null;
        saveEps(
          it,
          l,
          [n ? `サブタイトル${n}話` : "", dn ? `日付${dn}話` : ""].filter(Boolean).join("・") + "を更新しました",
        );
        refreshSheet();
        return true;
      }
    }
    if (e.target.closest("#epEditBtn")) {
      subPaste = null;
      epEdit = { list: episodes(it).map(x => ({ ...x })) };
      refreshSheet();
      return true;
    }
    if (epEdit) {
      if (e.target.closest("#erCancel")) {
        epEdit = null;
        refreshSheet();
        return true;
      }
      if (e.target.closest("#erSave")) {
        const l = epEdit.list.map(({ moved, ...x }) => x);
        epEdit = null;
        saveEps(it, l, "話数を保存しました");
        refreshSheet();
        return true;
      }
      if (e.target.closest("#erAdd")) {
        epEdit.list.push(nextEp(it, epEdit.list));
        refreshEditor();
        return true;
      }
      if (e.target.closest("#erBulkGo")) {
        const n = Math.min(200, +$("#erBulk").value || 0);
        for (let k = 0; k < n; k++) epEdit.list.push(nextEp(it, epEdit.list));
        refreshEditor();
        return true;
      }
      const d = e.target.closest("[data-erdel]");
      if (d) {
        epEdit.list.splice(+d.dataset.erdel, 1);
        refreshEditor();
        return true;
      }
    }
    if (e.target.closest("#delItem")) {
      const b = e.target.closest("#delItem");
      if (b.dataset.c) {
        const id = it.id,
          t0 = it.t,
          prev = { ...(over[id] || {}) };
        delete over[id];
        rebuild();
        close();
        render();
        removeDoc("titles", id).catch(fail);
        toastUndo(`「${t0.slice(0, 18)}」を削除しました`, () => {
          over[id] = prev;
          rebuild();
          render();
          saveDoc("titles", id, prev).catch(fail);
        });
      } else {
        b.dataset.c = "1";
        b.textContent = "もう一度押すと削除";
        b.classList.add("armed");
      }
      return true;
    }
  }
  return false;
}
