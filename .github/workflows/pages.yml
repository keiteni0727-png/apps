# main に反映するたびに、版の番号を自動で付けて GitHub Pages に公開する
# （リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく）
name: 公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 版の番号を付ける
        run: python3 .github/scripts/stamp.py "$(TZ=Asia/Tokyo date +%Y%m%d%H%M%S)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
